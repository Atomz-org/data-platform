# The architecture blueprint for commodity-india: what cannot be derived.
#
#   pf blueprint build commodity commodity-india   writes docs/mcx-platform-blueprint.html
#   pf blueprint check commodity commodity-india   is the committed page current?
#
# The data diagrams (conceptual and physical ER, model and column lineage, the
# data dictionary, decisions and every count) are derived from kg/graph.json,
# mdl/mdl.json and the compiled dbt SQL, so they are not here. This file holds
# the prose, the narrative diagrams (Mermaid) and three tables.
#
# The page is stamped with a fingerprint of this file and of the models, macros,
# graph, MDL and project Python. A commit that changes any of them without the
# rebuilt page is refused (gate.yaml `blueprint_required`), and CI fails a PR
# whose page is stale. Write no counts in this file: they go stale silently.
output: docs/mcx-platform-blueprint.html
text:
  title: MCX Platform Blueprint
  eyebrow: commodity · commodity-india · TOGAF 10 ADM views
  lede: 'End-to-end architecture of the MCX commodity pipeline on the data platform: market data from MCX, Yahoo Finance and
    gold-api lands through dlt, is modelled by dbt in DuckDB, measured by MetricFlow and a Wren semantic layer, served by
    Evidence and Ask the data, catalogued in OpenMetadata, orchestrated by Dagster and governed end to end. The data diagrams
    are generated from the project''s own artefacts: <code>kg/graph.json</code>, <code>mdl/mdl.json</code> and the compiled
    dbt SQL.'
  principles_title: The rules the architecture holds itself to
  principles_intro: Each principle is enforced somewhere in code or CI, named in the right column.
  vision_title: System context
  vision_intro: Who uses the platform, which external systems feed it, and the capabilities it provides for commodity-india.
  context_title: People, sources and platform capabilities
  business_title: Capability map and value stream
  business_intro: The value stream runs from an MCX session closing to a buying or hedging decision, in five numbered stages.
    Each stage is carried by one capability group; governance and change control span all of them.
  capability_title: Market close to decision
  app_intro: Every component and the direction data or control flows between them. Dotted lines from Dagster are orchestration;
    the planner chain falls back from the Claude API to the claude CLI to a deterministic rules planner.
  seq_ask_title: 'Ask the data: the gated road'
  seq_ask_caption: Claude only plans. SQL comes from the Wren engine over the MDL, is dry-run with EXPLAIN before it executes,
    and every step is written to the ledger.
  tech_intro: The shared stack runs in one container behind nginx, with Postgres and Elasticsearch as their own stateful containers.
    Local development runs <code>dagster dev</code> on :3070 against SQLite and the per-project DuckDB files.
  orch_title: One job per commodity, one catalogue pass after
  orch_intro: Each MCX commodity has a schedule and a job. Every step is idempotent, so any commodity can be rerun at any
    time; concurrent runs queue on the warehouse writer pool instead of colliding.
  orchestration_title: Asset graph of <code>mcx_gold_ingest</code>
  seq_daily_title: A daily run, step by step
  gov_title: Controls on change and at runtime
  gov_intro: Change is gated at commit and in CI. At runtime, agent actions are chained and anchored, and each AI control
    carries a FINOS AIR id that <code>pf air gate</code> checks against the project's commitments.
