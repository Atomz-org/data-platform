  # ------------------------------------------------------------------ recce --
  #
  # Four repositories, one upstream family, pinned under `vendor/recce/`.
  #
  # The intent was "submodule them under DataRecce/recce". That is not ours to
  # do: nesting a submodule *inside* recce means committing a .gitmodules to a
  # repository we do not own. What is ours is the directory they sit in, so the
  # family is grouped under `vendor/recce/<part>` and each part is pinned and
  # synced independently. `pf vendor sync` fetches all four; a fork is the only
  # way to get literal nesting, and a fork is a decision with an owner.
  #
  # This is also the reference implementation of `pf.tools`: recce is the first
  # tool wired through the Tool contract rather than bolted on, and every
  # borrowing below points at the one module that consumes it.
  - id: recce
    summary: "dbt PR review: the empirical half of impact analysis"
    name: Recce
    url: https://github.com/DataRecce/recce
    path: vendor/recce/core
    branch: main
    licence: Apache-2.0
    role: reference
    why: >
      The knowledge graph answers what *could* break when a model changes. Recce
      answers what *did* change, by diffing the built warehouse against a
      baseline. Those are different questions and the platform had only the
      first: `pf impact` reports a blast radius from lineage, with no way to say
      whether the numbers actually moved. Recce closes that, and it closes it
      against dbt's own artefacts rather than a parallel model of them.
    adopted:
      - upstream: recce/cli.py
        kind: data
        ours: [platform/src/pf/tools/recce.py]
        note: >
          We invoke the CLI as a subprocess — `recce run`, `recce server` — and
          both the subcommands and their flags are part of that contract. A
          renamed option is a silent behaviour change here, which is why this is
          `data` and not `shape`.
      - upstream: recce/constants.py
        kind: data
        ours: [platform/src/pf/tools/recce.py]
        note: >
          RECCE_CONFIG_FILE ("recce.yml") is the filename our bootstrap step
          writes. If upstream renames it, our generated config stops being read
          and every check silently reports zero.
      - upstream: recce/summary.py
        kind: shape
        ours: [platform/src/pf/tools/recce.py]
        note: >
          `recce run --summary` emits the markdown we attach to the Dagster run
          and to `pf pr`. We consume the file, not the function.
      - upstream: recce/mcp_server.py
        kind: shape
        ours: [platform/src/pf/tools/recce.py]
        note: >
          Recce serves its own MCP tools. Noted rather than adopted: `pf mcp`
          already fronts the graph, and two MCP servers answering overlapping
          questions is how an agent gets two different answers.
    declined:
      - what: recce_cloud/ and the `--cloud` flag
        why: >
          State would leave the machine. This platform is local-first and every
          warehouse is a file on disk; a cloud round-trip for diff state is a
          data-residency decision, not a convenience, and it is not one an agent
          should make. `pf tool recce` never passes --cloud.
      - what: "`top_k_diff` for category drift"
        why: >
          It cannot answer the question. The task returns parallel arrays
          (`values`, `counts`) and recce compares results with
          `DeepDiff(..., ignore_order=True)`, so renaming a category moves a
          count between slots while both arrays stay equal as multisets — the
          drift is invisible. Verified against a real rename: the check ran green
          while `starter` had become `basic`. We emit a `query_diff` keyed on the
          category instead, which returns one row per value and surfaces the same
          rename as a row present on one side only. The interactive UI renders
          the arrays side by side, so a human still sees it there; it is the
          headless summary that goes quiet, and that is the one CI reads.
      - what: "`recce init` for config generation"
        why: >
          It is interactive. Our recce.yml is generated from the ontology roles
          we already have — a natural key is a primary key, a money_amount is
          worth a value diff — so the config derives from the same declaration
          everything else does rather than from a wizard.

  - id: recce-ui
    summary: "React component library behind the Recce review UI"
    name: Recce UI
    url: https://github.com/DataRecce/recce-ui
    path: vendor/recce/ui
    branch: main
    licence: Apache-2.0
    role: reference
    why: >
      Pinned so the embedded review pane can be built against a known version of
      the components, and so a breaking change upstream is visible here rather
      than as a blank iframe.
    adopted:
      - upstream: package.json
        kind: parity
        ours: [platform/src/pf/tools/recce.py]
        note: >
          The version here and the `recce` package version must agree — the
          server serves a bundle built from these components, and a mismatch
          shows up as a UI that loads but cannot talk to its own API.
    declined:
      - what: Building our own review pane from the component library
        why: >
          `recce server` already serves a UI built from exactly these components.
          Rebuilding it would add a pnpm toolchain to a Python platform to
          reproduce something upstream ships working. We embed the server and
          keep the library pinned so the option stays open.

  - id: recce-claude-plugin
    summary: "Recce's own agent skills, agents and MCP wiring"
    name: Recce Claude Plugin
    url: https://github.com/DataRecce/recce-claude-plugin
    path: vendor/recce/claude-plugin
    branch: main
    licence: MIT
    role: skills
    why: >
      Upstream has already written down how an agent should drive Recce — which
      checks to run for a schema change, when a diff is inconclusive. That is the
      same shape as `platform/toolkits/`, so it is a source for our toolkit
      rather than something to invent.
    adopted:
      - upstream: plugins/recce/skills/recce-review
        kind: port
        ours: [platform/toolkits/recce-review/skills/recce-review/SKILL.md]
        note: >
          The review workflow — baseline, run, read the diff, decide — ported to
          our toolkit format and to `pf tool recce` instead of bare `recce`.
      - upstream: plugins/recce/agents/recce-reviewer.md
        kind: shape
        ours: [platform/toolkits/recce-review/skills/recce-review/SKILL.md]
        note: >
          The reviewer's stopping rule — a diff you cannot explain is a finding,
          not noise.
    declined:
      - what: plugins/recce/hooks/ and settings/defaults.json
        why: >
          Session hooks and permissions are already the platform's: `gate.yaml`
          and the PreToolUse hook decide what an agent may write. A second hook
          system layered underneath is how a gate ends up with two answers.
      - what: servers/recce-docs-mcp
        why: Documentation search. `pf mcp` serves the graph; docs are a browser tab.

  - id: recce-pr-update
    summary: "Composite action keeping a PR branch merged with its base"
    name: Recce PR-Update
    url: https://github.com/DataRecce/PR-Update
    path: vendor/recce/pr-update
    branch: main
    licence: MIT
    role: spec
    why: >
      A dbt diff is only meaningful when the PR branch actually contains its
      base. A stale branch produces a diff against code that was already
      replaced, which reads as a regression that does not exist. This action is
      the precondition for trusting anything Recce reports in CI.
    adopted:
      - upstream: action.yml
        kind: data
        ours: [platform/src/pf/tools/recce.py]
        note: >
          The generated workflow pins this action and passes `baseBranch` /
          `prBranch` / `autoMerge`. Renamed inputs break the workflow at run
          time, in CI, which is the worst place to find out — hence `data`.
    declined:
      - what: autoMerge defaulting to true
        why: >
          Upstream defaults to merging the base into the PR branch automatically.
          We generate it with autoMerge false: a merge is a write to someone's
          branch, and the platform's rule is that an agent reports and a human
          merges. The reminder comment is enough to unblock the diff.

  # -------------------------------------------------------------------- ui --
  - id: forge
    summary: "the control plane's component layer and design tokens"
    name: Forge (wss3-forge)
    url: https://github.com/Webba-Creative-Technologies/forge
    path: vendor/forge
    branch: main
    licence: MIT
    role: library
    why: >
      The control plane was one hand-written HTML file. That was the right call
      while it was a diagnostic surface and the wrong one once data owners were
      expected to edit governance in it: every table, dialog and form was bespoke,
      and accessibility was whatever the last edit remembered. Forge supplies the
      component layer and, unusually, ships its own Claude Code skill pack — so
      the rules for using it are checked in rather than re-derived per session.
    adopted:
      - upstream: skills/forge
        kind: data
        ours:
          - platform/toolkits/forge-ui/skills/forge-ui/SKILL.md
        note: >
          Registered as a platform skill and read verbatim at authoring time. If
          upstream renames a component or changes a token, the skill is the thing
          that goes stale, which is why this is `data` and not `shape`.
      - upstream: package.json
        kind: data
        ours:
          - platform/src/pf/ui/web/package.json
        note: >
          We install the published `wss3-forge` wheel-equivalent from npm and pin
          the submodule for provenance, the same split the recce entry documents:
          the registry is the contract, the package is the artefact we run.
      - upstream: DESIGN.md
        kind: shape
        ours: [platform/src/pf/ui/web/src/theme.css]
        note: Token names and the light/dark contract come from here.
    declined:
      - what: forge's motion primitives on data tables
        why: >
          Animated row entry on a table an operator is scanning for a changed
          number costs reading time and gives nothing back. Motion is kept for
          overlays and state transitions, where it explains what moved.

  - id: shadcn-admin
    summary: "dashboard shell and theme presets, reference only"
    name: Next.js shadcn Admin Dashboard
    url: https://github.com/arhamkhnz/next-shadcn-admin-dashboard-baseui
    path: vendor/shadcn-admin
    branch: main
    licence: MIT
    role: reference
    why: >
      Adopted for its layout and theming decisions, not its code: this is a
      Next.js application and our control plane is a Vite SPA served by the
      FastAPI that already owns the API. Copying the app would have meant a
      second long-running server in a Python monorepo to gain screens we do not
      need. What it is genuinely good at is the shell — collapsible sidebar,
      grouped navigation, theme presets — and that is what was taken.
    adopted:
      - upstream: src/app
        kind: shape
        ours: [platform/src/pf/ui/web/src/App.tsx]
        note: >
          Sidebar-plus-topbar shell, navigation grouped by intent, and the
          content column that scrolls independently of the rail.
    declined:
      - what: the Next.js application itself
        why: >
          App Router, SSR and a Node server buy nothing here — every screen reads
          a local FastAPI endpoint on localhost. It would have added a second
          runtime to deploy and a build story to a repo that had neither.
      - what: the bundled auth flows and RBAC screens
        why: >
          The control plane binds to 127.0.0.1 and is single-operator. Shipping a
          login form over no authentication would imply a boundary that is not
          there.

  # ------------------------------------------------------------- catalogue --
  - id: openmetadata-standards
    summary: "entity schemas our catalogue payloads validate against"
    name: OpenMetadata Standards
    url: https://github.com/open-metadata/OpenMetadataStandards
    path: vendor/openmetadata-standards
    branch: main
    licence: Apache-2.0
    role: spec
    why: >
      Pinned separately from the product, and this is the point of the split. The
      server validates what it is sent; without these schemas we would find out
      whether a payload was well-formed by watching an ingestion fail against a
      live catalogue. Here the same JSON Schemas run in the test suite, so an
      upstream field becoming required breaks the build at the pin bump instead.
    adopted:
      - upstream: schemas/api/data/createGlossary.json
        kind: schema
        ours: [platform/src/pf/projections/openmetadata.py]
        note: The glossary payload is validated against this exact file.
      - upstream: schemas/api/data/createGlossaryTerm.json
        kind: schema
        ours: [platform/src/pf/projections/openmetadata.py]
        note: >
          Every ontology class and policy becomes one of these. `glossary`,
          `name` and `description` are required, which is why an undocumented
          concept publishes an explicit "no description in the ontology" rather
          than an empty string that would read as deliberate.
      - upstream: schemas/api/classification/createClassification.json
        kind: schema
        ours: [platform/src/pf/projections/openmetadata.py]
      - upstream: schemas/api/classification/createTag.json
        kind: schema
        ours: [platform/src/pf/projections/openmetadata.py]
        note: One tag per ontology role.
      - upstream: schemas/api/data/createMetric.json
        kind: schema
        ours: [platform/src/pf/projections/openmetadata.py]
      - upstream: schemas/type/basic.json
        kind: schema
        ours: [platform/src/pf/projections/openmetadata.py]
        note: >
          `entityName` forbids `::` because that is the field separator in the
          `entityLink` grammar. `_om_name` enforces it rather than trusting our
          identifiers to be safe by luck.
    declined:
      - what: the RDF/OWL ontology and SHACL shapes
        why: >
          Tempting, because this platform already emits OWL. Declined for now:
          aligning our OWL export to OpenMetadata's ontology is a modelling
          decision about whose vocabulary wins, and making it silently inside a
          catalogue integration is how an ontology acquires a second owner.
      - what: the OpenAPI specification
        why: >
          We do not generate a client. `metadata` ships one, and a second
          hand-rolled client is a second thing to keep in step with the server.

  - id: openmetadata
    summary: "catalogue ingestion, and the dbt connector for lineage"
    name: OpenMetadata
    url: https://github.com/open-metadata/OpenMetadata
    path: vendor/openmetadata
    branch: main
    licence: Apache-2.0
    role: engine
    # Cloned shallow, and that is a real limitation rather than a preference.
    # Full history did not fit — `git fetch --unshallow` exhausted the disk on a
    # machine with 8 GB free. Consequences, so nobody is surprised:
    #   - drift detection still works: it hashes the content of adopted files at
    #     the current checkout, which a shallow clone has.
    #   - `pf vendor sync` cannot report "N commit(s)" between two pins for this
    #     upstream, because the range is not in the clone. Read the compare view
    #     on GitHub instead when bumping it.
    # `vendor/openmetadata-standards` is full-history — it is 8 MB and it is the
    # one carrying the schemas our tests validate against, so its diffs matter
    # most and cost least.
    why: >
      The catalogue is the surface for people who do not read YAML. What made it
      worth integrating rather than reimplementing is the dbt connector: it reads
      manifest.json and catalog.json and produces column-level lineage, which we
      would otherwise be re-deriving from the knowledge graph, worse, and then
      reconciling two answers.
    adopted:
      - upstream: ingestion/src/metadata/workflow/metadata.py
        kind: shape
        ours: [platform/src/pf/tools/openmetadata.py]
        note: >
          The workflow shape our generated `catalog/ingestion.yaml` conforms to —
          source / sink / workflowConfig. Run through the `metadata` CLI rather
          than by importing MetadataWorkflow, so the pinned wheel owns its own
          execution and we own only the configuration.
    declined:
      - what: the Airflow-based ingestion scheduler
        why: >
          OpenMetadata schedules ingestion with its own Airflow. This platform
          already orchestrates with Dagster, and the catalogue must describe the
          build that just happened — so ingestion is a Dagster asset downstream
          of the marts, not a separate timer that drifts from the warehouse
          between runs.
      - what: writing back from the catalogue to the ontology
        why: >
          The ontology is canonical in YAML, in git, judged by `pf check` and the
          gate. A catalogue that can silently redefine a concept is a second
          source of truth, and then neither side can say what `Customer` means.
      - what: emitting tables and lineage from our own graph
        why: >
          `metadata ingest-dbt` already does it from the dbt artefacts. Two
          descriptions of one table drift apart, and the catalogue shows whichever
          ran last.

  # ------------------------------------------------------------ governance --
  - id: asqav-compliance
    summary: "the five governance controls a CI scan checks agent code for"
    name: ASQAV Compliance Scanner
    url: https://github.com/jagmarques/asqav-compliance
    path: vendor/asqav-compliance
    branch: main
    licence: Elastic-2.0
    licence_review: >
      Elastic License 2.0 permits use and modification but forbids providing the
      software to third parties as a hosted or managed service, and forbids
      circumventing licence-key functionality. We run it as a GitHub Action
      inside our own CI on our own code, which is ordinary internal use and well
      inside scope. Two limits to hold: this platform must not expose the scanner
      as a compliance-scanning feature to its own tenants (that is the managed
      service the licence excludes), and the action's code stays vendored
      unmodified. Note this is a *stricter* licence than the platform's other
      upstreams — confirm with counsel before offering governance scanning as a
      product surface.
    role: reference
    why: >
      It is a second opinion with a different failure mode. `pf provenance` is
      runtime evidence: it proves what the ledger recorded and can say nothing
      about code no agent has exercised yet. The scanner is static: it reads
      agent source and asks whether the controls are present at all, mapped to
      EU AI Act, DORA and ISO 42001. A control that exists but never runs is
      invisible to us and visible to it, and the reverse is equally true — which
      is the only reason to carry both.
    adopted:
      - upstream: src/scanner.ts
        kind: shape
        ours:
          - platform/src/pf/provenance/ledger.py
          - platform/src/pf/provenance/audit.py
        note: >
          Its five categories — audit trail, policy enforcement, revocation,
          human oversight, error handling — are the checklist our ledger is built
          to satisfy in behaviour rather than in vocabulary: `intent`/`decision`/
          `execution` are the audit trail, `pf.loops.gate` the policy
          enforcement, `revoke`/`reinstate` the revocation, `approve` the human
          oversight. Ours differ in kind: the scanner matches identifiers, we
          record what actually happened and hash-link it.
      - upstream: action.yml
        kind: data
        ours: [.github/workflows/ai-governance.yml]
        note: >
          Run from the submodule path (`uses: ./vendor/asqav-compliance`) rather
          than by tag, so the code that judges our compliance is pinned like
          every other upstream here. Its inputs and outputs are the contract that
          workflow depends on; upstream renaming `score` or `gaps` breaks the
          job summary.
    declined:
      - what: the `asqav` runtime SDK (asqav / @asqav/sdk)
        why: >
          It ships actions to a hosted service, defaulting to hash-only mode
          against *.asqav.com. Our ledger is local, append-only and anchored to a
          public timestamp authority — an auditor verifies it with openssl and a
          150-line stdlib script, trusting neither them nor us. Adding a
          third-party trust dependency to the evidence path would remove the one
          property the design exists for.
      - what: failing the build on the scanner's compliance score
        why: >
          It is regex over source. A file that mentions `revoke` in a comment
          scores as having revocation, and a correct implementation that spells
          it `disable_agent` scores as missing it. Useful as a prompt to go and
          look; wrong as a merge gate. `pf provenance verify` blocks instead,
          because it tests behaviour.

  - id: public-sector-ai-playbook
    summary: "the governance artefacts a regulated deployment has to produce"
    name: Public Sector AI Playbook
    url: https://github.com/PackMaaan/public-sector-ai-playbook
    path: vendor/public-sector-ai-playbook
    branch: main
    licence: CC BY 4.0
    licence_review: >
      Creative Commons Attribution 4.0 — the most permissive licence in this
      registry. Use, adaptation and redistribution are all allowed, commercially
      included, on one condition: attribution. Any template we derive from must
      credit the author (Linda Oraegbunam) and state that changes were made.
      That obligation travels with the *derived artefact*, not with this
      repository, so a model card or risk register generated for a company and
      handed to its regulator carries the credit line — which is why nothing
      here is copied into the platform silently.
    role: reference
    why: >
      It closes the third side of the governance question. `pf.provenance` is
      runtime evidence — what an agent actually did, hash-linked and anchored.
      `asqav-compliance` is static analysis — whether the controls exist in the
      code. Neither says what the controls should *be*, and for a regulated
      deployment that is the part someone external judges: a model card, a bias
      audit, a risk register, a supplier due-diligence trail, mapped to the UK
      AI Playbook (2025) and the EU AI Act.

      Carried rather than copied because these are templates for a *deployment*,
      and this platform is multi-tenant: the risk register belongs to a company,
      not to the shared infra. The submodule is the reference a project fills in
      from, pinned so the version a regulator was shown is the version we still
      have.
    adopted:
      - upstream: 05-deployment/model-card-template.md
        kind: shape
        ours: [platform/src/pf/provenance/audit.py]
        note: >
          The audit's four questions — integrity, completeness, coverage,
          oversight — are the evidence half of what a model card asks for. Ours
          answers them from the ledger rather than from a form, which is the
          difference between a document that asserts human oversight and a chain
          that shows the approval.
      - upstream: 04-governance/ai-risk-register-template.md
        kind: shape
        ours: [gate.yaml]
        note: >
          A risk register names the controls; gate.yaml is the subset that is
          machine-enforced. Drift between the two is the thing to watch — a
          register entry with no gate rule is a control that exists only on
          paper, and that comparison is the reason to carry the template at all.
    declined:
      - what: tools/readiness_scorer.py
        why: >
          It is an interactive CLI that prompts for 25 answers and crashes on a
          non-TTY (no `--help`, no flags), so it cannot run in CI or from a
          loop. `pf.loops.audit` already scores readiness from the repository
          itself — hook present, graph built, card current — which is a measure
          nobody can talk up in an interview with themselves.
      - what: tools/governance_report_generator.py
        why: >
          Verified working (it generates a governance pack from a project JSON),
          and still not adopted: it reads a hand-written config, so the report
          says whatever the config claims. Ours would have to read the ontology
          and the ledger, and at that point it shares no code with this — only
          the output shape, which is what `adopted` above records.
      - what: the sector playbooks (healthcare, local government)
        why: >
          NHS DSPT, DCB0129 and MHRA/SaMD classification are real obligations
          for a healthcare deployment and noise for every other tenant. They
          belong to a project that has that regulator, not to shared infra —
          the same reason business logic never lives in platform/.

  - id: ai-governance-framework
    summary: "the risk taxonomy and control catalogue, cross-walked to the regulators"
    name: FINOS AI Governance Framework
    url: https://github.com/Atomz-org/ai-governance-framework
    path: vendor/ai-governance-framework
    branch: main
    licence: CC BY 4.0
    licence_review: >
      Creative Commons Attribution 4.0, the same licence as the public-sector
      playbook and the same obligation: attribution travels with the *derived
      artefact*, not with this repository. Every `governance/air-register.md` we
      generate, and any control report exported from `pf air`, carries a credit
      line naming FINOS and stating that changes were made. `pf air` refuses to
      write a register without it — an attribution you can forget to add is one
      you will forget to add.

      Copyright is FINOS (info@finos.org), 2025. Note the licence history in the
      upstream NOTICE: Apache-2.0 at creation, CC-0 from October 2024, CC BY 4.0
      from April 2025. The pin is well after that last change, so CC BY 4.0 is
      what governs what we hold.

      **The pinned remote is a fork.** `Atomz-org/ai-governance-framework` was
      byte-identical to `finos/ai-governance-framework` at pin time (0 ahead, 0
      behind). Upstream is canonical and stays canonical: the fork exists so a
      FINOS change lands here as a merge someone reviewed rather than as a
      branch that moved under us. Switching back is a one-line `url` change in
      .gitmodules — nothing in `pf.air` knows or cares which remote it came from.
    role: reference
    why: >
      It closes the fourth side of the governance question, and it is the only
      side that can be read by code.

      `pf.provenance` is runtime evidence — what an agent did, hash-linked and
      anchored. `asqav-compliance` is static analysis — whether the controls
      exist in the source. `public-sector-ai-playbook` is the artefact a
      regulator is handed. None of the three says *which controls there are*, and
      none maps a control to the regulation it discharges. Before this, our ten
      `policy.yaml` entries were a list someone wrote down, and "does this
      satisfy the EU AI Act?" had no answer even though the evidence to answer it
      was already on disk.

      This is that missing referent: 23 risks and 23 controls with a public,
      stable id scheme (`AIR-SEC-24`, `AIR-DET-21`), each carrying its own
      citations into the EU AI Act, ISO 42001, NIST SP 800-53r5, NIST AI 600-1,
      OWASP LLM/ML/ASI, FFIEC, SR 11-7, IOSCO and the UK and Canada regimes.
      Six of the risks (24-29) are specifically agentic — authorization bypass,
      tool-chain manipulation, MCP supply-chain compromise, state poisoning,
      multi-agent trust boundaries, credential harvesting — which is this
      platform's actual threat surface rather than a generic GenAI one.

      Carried as `data` rather than `reference` because we read the frontmatter
      at runtime. That is deliberate: it makes an upstream rename a build
      failure instead of a slowly rotting mapping.

      It is pinned as *a* catalogue, not *the* catalogue. `pf.air` reads control
      catalogues generally; this one is a `CatalogueSource` in
      `platform/src/pf/air/sources.py`, and a second — a sector regulator's, a
      tenant's own control library — is another such object on the
      `pf.catalogues` entry point of any installed distribution. Nothing in the
      parser, the coverage derivation, the gate or the CLI names FINOS. That
      matters here specifically because this platform is multi-tenant: a
      financial-services framework is the right default for some sisters and
      noise for others, and swapping it must not be a fork of the reader.
    adopted:
      - upstream: docs/_mitigations
        kind: data
        ours: [platform/src/pf/air/sources.py, platform/src/pf/air/catalogue.py]
        note: >
          23 control definitions. We read `sequence`, `type`, `title`,
          `doc-status`, `mitigates:` and every `<framework>_references:` list
          from the YAML frontmatter; the prose body below it is guidance for a
          human and we do not parse it. The public id is derived, not stored —
          `AIR-{type}-{sequence}` — which is why `type` changing from PREV to DET
          upstream renames a control, and why `pf air verify` checks the set of
          derived ids rather than trusting filenames.
      - upstream: docs/_risks
        kind: data
        ours: [platform/src/pf/air/sources.py, platform/src/pf/air/catalogue.py]
        note: >
          23 risk definitions, same frontmatter contract. Sequence numbers are
          non-contiguous (1, 2, 4-10, 14, 16-20, 22-29) because entries have been
          retired, so nothing here may assume a dense range.
      - upstream: docs/_data/references
        kind: data
        ours: [platform/src/pf/air/sources.py, platform/src/pf/air/catalogue.py]
        note: >
          13 crosswalk files, one per external regime, each an `entries:` mapping
          from a stable key to a title and canonical URL. These keys are the
          contract — upstream's own README says renaming one is breaking — and
          they are what turns "we enforce least privilege" into "we discharge
          EU AI Act Article 12 and NIST AC-6". `pf air verify` resolves every
          reference in every risk and control against these files and fails on
          the first dangling key.
      - upstream: docs/_data/ai_deployment_model.yml
        kind: parity
        ours: [platform/src/pf/air/register.py]
        note: >
          The taxonomy a project classifies itself against in `air.yaml`
          (`ai_type`, `architecture_pattern`, `workflow_pattern`,
          `agent_pattern`). Parity rather than data: we validate a project's
          declared profile against upstream's vocabulary, so an upstream that
          adds a pattern means a project may now describe itself more precisely,
          not that our build breaks.
      - upstream: docs/heuristic-assessment.md
        kind: shape
        ours: [platform/src/pf/air/register.py]
        note: >
          Its eight steps (use case, data, model, output impact, regulatory
          mapping, security, controls, decision) are the section order of the
          generated register. Ours answers the ones it can from the ontology and
          the ledger and leaves the rest to `air.yaml` — the difference between
          a form someone filled in and a report derived from the repository.
      - upstream: templates-for-ri-md/mi-template.md
        kind: parity
        ours: [platform/src/pf/air/sources.py]
        note: >
          The declared frontmatter contract for a control, and the reason our
          `Class` literal admits `RESP` even though no control uses it yet: the
          template says PREV|DET|RESP, so a response control appearing upstream
          must parse rather than crash.
    declined:
      - what: the Jekyll site (_layouts, _includes, style.css, single-page.html, _config.yml)
        why: >
          We render from the frontmatter, not from their templates. Adopting the
          Liquid layer would mean carrying a static-site generator to answer
          "which control covers this risk" — a question a dict already answers.
          `_config.yml` is the one near miss: it defines the RC/OP/SEC and
          PREV/DET type vocabularies. Those are eight literals, and copying them
          into `catalogue.py` where the parser can see them is clearer than
          reading a Jekyll config at runtime to learn two enums.
      - what: scripts/dl_eu-ai-act.py, dl_nist-pdfs.py, dl_owasp.py, dl_ffiec-itbooklets.py
        why: >
          They regenerate the crosswalk YAMLs by fetching regulator sites and
          PDFs. A build that reaches the open internet fails differently every
          day, and the reason to pin an upstream at all is that the version a
          regulator was shown is the version we still have. The vendored YAML
          *is* the pin; regenerating it is upstream's job, and it reaches us as a
          reviewed pin bump.
      - what: the four use cases (docs/_usecases — credit risk, wealth management, loan approval, financial crime)
        why: >
          They are worked examples of a *tenant's* business context, and this
          platform is multi-tenant. A loan-approval threat model belongs to the
          company doing loan approval, not to shared infra — the same reason the
          playbook's sector playbooks were declined and the same reason business
          logic never lives in platform/. A project that wants one fills in its
          own `air.yaml` profile; the framework's are reference reading.
      - what: registering the catalogue as a `pf.tools` Tool
        why: >
          The Tool seam is for capabilities that also run — a Dagster asset, a UI
          surface, a dbt binding — and this has none. It is also the wrong
          safety posture: a governance baseline that `pf tool disable` can switch
          off is not a baseline. It lands as a first-class module and CLI group,
          the same shape as `pf provenance` and `pf vendor`.
      - what: doc-status as a gate input
        why: >
          Every control we map is `Approved-Specification` today, and it is
          tempting to fail on anything less. Declined: upstream's status ladder
          (Pre-Draft, Draft, Working-Group-Approved, Approved-Specification)
          describes *their* consensus, and letting it decide whether our build
          passes would hand a FINOS working group a vote on our merge gate. It is
          parsed, reported by `pf air show`, and enforces nothing.
