# Every pull request: is the context every agent reads still true?
#
# Three tools read three entry points — CLAUDE.md, AGENTS.md (+ GEMINI.md,
# which imports it), .github/copilot-instructions.md — and all of them send the
# reader to the same generated context: the memory and test indexes, the repo
# map, the onboarding guide, the harness maps, each project's MDL manifest and
# OKF bundle. No path filter, because the point is *every* PR.
#
# ## Generated files are healed, not failed
#
# Every one of those generated files is a pure function of the tree, and
# `pf context refresh` rewrites all of them. Failing a pull request because
# one was not rewritten was the commonest red run in this repository, and the
# cheapest to cause: one new test file turned four checks red (this job,
# `platform-tests`, and three currency tests inside the suite that `platform`
# and `platform-tests` both run). So the policy is now:
#
#   check      regenerates first, then runs every check against the result.
#              Staleness is a warning with the file list in the run summary;
#              a check goes red only for what a refresh cannot fix — a pointer
#              to a section that does not exist, an OKF page naming no graph
#              node, an over-cap commit, a real test failure.
#   refresh    (pull requests) pushes the regenerated files to the branch when
#              AGENT_CONTEXT_TOKEN can push, so the diff under review is
#              whole. Optional: a token that cannot push is a warning, never
#              a red check, because `heal-main` makes the outcome the same.
#   heal-main  (every push to main) regenerates and commits to main with the
#              workflow's own GITHUB_TOKEN. This is the guarantee: whatever
#              merged, and in whatever order two pull requests landed, main is
#              current minutes later, so no branch cut from it inherits a stale
#              file it did not touch. Its push starts no workflow run — GitHub
#              does not trigger runs from GITHUB_TOKEN pushes — so it cannot
#              loop.
#
# The trade: a pull request can merge with its generated files unrefreshed,
# and main describes the previous tree for the minutes `heal-main` takes. Every
# reader of these files is an agent or a person between sessions, not a build
# step, so minutes of lag cost nothing; a red X on every PR that adds a test
# cost a CI round and a context switch each time.
name: agent-context

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: agent-context-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.regenerate.outputs.stale }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit cap below measures each commit this PR adds, so it needs
          # the base branch and the commits themselves, not a shallow tip.
          fetch-depth: 0

      # Pin by pin, not `submodules: recursive`: one unreachable upstream must
      # not take the whole check with it (see platform-tests.yml).
      - name: Vendored upstreams
        run: |
          failed=""
          for path in $(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}'); do
            git submodule update --init "$path" >/dev/null 2>&1 || failed="$failed $path"
          done
          [ -z "$failed" ] || echo "::warning title=Vendored upstreams unreachable::$failed"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen

      # Before any check: rewrite every generated file, and say which moved.
      # The checks below then judge the regenerated tree, so they fail only on
      # what a refresh cannot fix. The list goes to the run summary and to the
      # `refresh` job through the `stale` output.
      - name: Regenerate generated context
        id: regenerate
        run: |
          uv run pf context refresh --paths-to "$RUNNER_TEMP/regenerated.txt"
          if [ -s "$RUNNER_TEMP/regenerated.txt" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            n=$(wc -l < "$RUNNER_TEMP/regenerated.txt" | tr -d ' ')
            echo "::warning title=Generated context was out of date::$n generated file(s) differ from what this branch produces. Not a failure — they are regenerated for you (see the run summary)."
            {
              echo "## Generated context regenerated in CI"
              echo
              echo "These files differ from what this branch produces. The checks below ran against the regenerated versions."
              echo "They are pushed to this branch when \`AGENT_CONTEXT_TOKEN\` can push, and to \`main\` after merge regardless."
              echo "To include them yourself: \`uv run pf context refresh\` and commit."
              echo
              echo '```'
              cat "$RUNNER_TEMP/regenerated.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The cap that had no second look. `maxFiles` is a *per-run* rule applied
      # to whatever set one call hands the gate, and until this step the only
      # caller was the local pre-commit hook over one staged set — so
      # `git commit --no-verify`, or a clone where nobody had ever run `pf`,
      # produced commits the gate never saw and nothing afterwards re-measured.
      # The hook is not committable; git does not clone `.git/hooks`. A control
      # that only runs where someone remembered to install it is the control
      # this repo already learned not to trust.
      #
      # So the same rule, from the same gate.yaml, is re-applied here to each
      # commit the pull request adds. Per commit, never over the union: a pull
      # request legitimately touches more files than one run should, which is
      # why `pf pr report` skips the cap entirely (see pf/pr.py). Merges are
      # excluded — a merge's diff is the whole branch it absorbs, and the
      # commits inside it are each judged on their own.
      #
      # An over-cap commit that cannot be split says so in its own message, in
      # a `Gate-Exempt: <reason>` trailer, and passes as a warning. The rule was
      # never that a change may not exceed twelve files; it is that exceeding it
      # may not be silent.
      - name: Every commit is within the file cap
        if: github.event_name == 'pull_request'
        run: uv run pf gate --commits "origin/${{ github.event.pull_request.base.ref }}..HEAD"

      - name: Entry points agree (CLAUDE.md, AGENTS.md, GEMINI.md, Copilot) and harness configs are current
        run: uv run pf context check

      - name: Memory index is current
        run: uv run pf memory check

      - name: Test index is current
        run: uv run pf test check

      - name: Architecture map is current
        run: uv run pf arch check

      # The newcomer's page. Generated from the CLI, the groups, the scaffold
      # and the registries, so the PR that renames a command is the PR that
      # would make it lie — and this is the job that notices.
      - name: Onboarding guide is current
        run: uv run pf guide check

      # What wraps an agent in each group, project and report: its settings,
      # the gate's verdicts on its paths, its hooks, workflow, loops and
      # tools. The PR that enables a tool or silences a loop is the PR that
      # makes a map lie, and this is the job that notices.
      - name: Harness maps are current
        run: uv run pf harness check

      # The BI semantic layer, against the graph it is projected from. It was
      # the one artefact in the chain nothing compared — excluded from the
      # converged gate because a bare runner rebuilds it from a warehouse it
      # cannot build — and two manifests aged past the whole reporting layer
      # before an end-to-end run noticed. This compares the committed manifest
      # with a projection of the committed `kg/graph.json`, rebuilding neither.
      - name: MDL manifests are current with their graphs
        run: uv run pf semantic mdl --check --all

      # What a table and a column *mean*, as every agent and catalogue reads
      # it — and the graph it is joined to. Built from tracked inputs only
      # (`mdl/mdl.json`, `kg/graph.json`), so this compares the same way on a
      # runner with no warehouse as on a laptop with one. The PR that renames a
      # model or changes a role is the PR that makes a page lie, and `graph`
      # catches the other half: a bundle and a graph rebuilt without each other.
      - name: OKF bundles are current and joined to the graph
        run: |
          uv run pf tool okf check --all
          uv run pf tool okf graph --all

      - name: Token budgets (advisory until the jaffle-shop card is decided)
        continue-on-error: true
        run: |
          uv run pf tokens || echo "::warning title=Over budget::a CLAUDE.md or a card is over its token budget — \`uv run pf tokens\` names it; trim it or raise the budget in platform/src/pf/kg/card.py"

  # Pushes the files `check` regenerated to a same-repository PR branch —
  # never a fork's — so the diff under review includes them. It needs
  # AGENT_CONTEXT_TOKEN rather than GITHUB_TOKEN: a push made with GITHUB_TOKEN
  # starts no workflow run, so the PR's head would carry no checks at all. Any
  # failure to push is a warning: `heal-main` regenerates after merge anyway,
  # and a misconfigured token must not put a red X on every pull request.
  refresh:
    needs: check
    if: >-
      always() &&
      needs.check.outputs.stale == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check for token
        id: guard
        env:
          TOKEN: ${{ secrets.AGENT_CONTEXT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice title=Not pushing generated context::AGENT_CONTEXT_TOKEN is not set; heal-main regenerates after merge."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.AGENT_CONTEXT_TOKEN }}

      - name: Vendored upstreams
        if: steps.guard.outputs.ready == 'true'
        run: git submodule update --init vendor/okf-weaver >/dev/null 2>&1 || echo "::warning::okf-weaver unreachable; OKF bundles not refreshed"
      - uses: astral-sh/setup-uv@v5
        if: steps.guard.outputs.ready == 'true'
        with:
          enable-cache: true
      - run: uv sync --frozen
        if: steps.guard.outputs.ready == 'true'

      - name: Refresh, commit and push
        if: steps.guard.outputs.ready == 'true'
        env:
          PF_AGENT: actions:agent-context
        run: |
          uv run pf install-hook
          uv run pf context refresh --paths-to "$RUNNER_TEMP/refreshed.txt"
          if [ ! -s "$RUNNER_TEMP/refreshed.txt" ]; then
            echo "nothing to commit — the branch already holds what it produces"
            exit 0
          fi
          git config user.name "agent-context[bot]"
          git config user.email "agent-context[bot]@users.noreply.github.com"
          cap=$(uv run python -c "from pathlib import Path; from pf.loops.gate import load_policy; print(int(load_policy(Path('.')).get('maxFiles') or 12))")
          bash platform/hooks/commit_refreshed.sh "$RUNNER_TEMP/refreshed.txt" "$cap" "Refresh agent context"
          if ! git push 2>"$RUNNER_TEMP/push.err"; then
            cat "$RUNNER_TEMP/push.err"
            echo "::warning title=Could not push generated context::$(tail -1 "$RUNNER_TEMP/push.err"). AGENT_CONTEXT_TOKEN needs Contents: read and write on this repository, owned by the organisation and approved by it. Not a failure: heal-main regenerates after merge."
            {
              echo "## Generated context not pushed"
              echo
              echo "The push was refused: \`$(tail -1 "$RUNNER_TEMP/push.err")\`."
              echo "Check the token behind AGENT_CONTEXT_TOKEN: resource owner = the organisation, repository access includes this repository, **Contents: Read and write**, and approved if the organisation requires approval."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # The guarantee. After every merge, main is regenerated and whatever moved is
  # committed straight to main with the workflow's own token — main has no
  # branch protection, and a GITHUB_TOKEN push starts no workflow run, so this
  # cannot trigger itself. If main moved while it worked, it starts again from
  # the new tip rather than rebasing generated files onto each other.
  heal-main:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: agent-context-heal-main
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Vendored upstreams
        run: git submodule update --init vendor/okf-weaver >/dev/null 2>&1 || echo "::warning::okf-weaver unreachable; OKF bundles not refreshed"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen

      - name: Regenerate, commit and push to main
        env:
          PF_AGENT: actions:agent-context
        run: |
          uv run pf install-hook
          git config user.name "agent-context[bot]"
          git config user.email "agent-context[bot]@users.noreply.github.com"
          cap=$(uv run python -c "from pathlib import Path; from pf.loops.gate import load_policy; print(int(load_policy(Path('.')).get('maxFiles') or 12))")
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            uv run pf context refresh --paths-to "$RUNNER_TEMP/healed.txt"
            if [ ! -s "$RUNNER_TEMP/healed.txt" ]; then
              echo "main is current"
              exit 0
            fi
            made=$(bash platform/hooks/commit_refreshed.sh "$RUNNER_TEMP/healed.txt" "$cap" "Heal generated context on main")
            if git push origin HEAD:main; then
              {
                echo "## Healed main"
                echo
                echo "$made commit(s) regenerating:"
                echo '```'
                cat "$RUNNER_TEMP/healed.txt"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "main moved during the refresh (attempt $attempt); starting again from the new tip"
          done
          echo "::error title=Could not heal main::three attempts lost the race to newer merges; the next push to main retries"
          exit 1
