# Generated by `pf report build`. Palette values are validated —
# adjacent-pair CVD deltaE >= 8, normal-vision >= 15, contrast checked on both
# surfaces (#ffffff light, #09090b dark). Re-picking them by eye makes charts
# unreadable for ~8% of readers, and slot ORDER is the CVD-safety mechanism:
# never reorder, never append. Light-mode slots 3-5 (aqua, yellow, magenta) are
# below 3:1 on white — a chart leaning on them needs visible labels or a
# companion table.
title: acme-us

appearance:
  default: system
  switcher: true

plugins:
  components:
    "@evidence-dev/core-components": {}
  datasources:
    "@evidence-dev/duckdb": {}

theme:
  colorPalettes:
    default:
      light:
        - '#2a78d6'
        - '#eb6834'
        - '#1baf7a'
        - '#eda100'
        - '#e87ba4'
        - '#008300'
        - '#4a3aa7'
        - '#e34948'
      dark:
        - '#3987e5'
        - '#d95926'
        - '#199e70'
        - '#c98500'
        - '#d55181'
        - '#008300'
        - '#9085e9'
        - '#e66767'
  colorScales:
    default:
      light:
        - '#cde2fb'
        - '#3987e5'
        - '#0d366b'
      dark:
        - '#104281'
        - '#3987e5'
        - '#9ec5f4'
  colors:
    primary:
      light: '#256abf'
      dark: '#3987e5'
    accent:
      light: '#eb6834'
      dark: '#d95926'
    base:
      light: '#ffffff'
      dark: '#09090b'
    info:
      light: '#2a78d6'
      dark: '#3987e5'
    positive:
      light: '#0ca30c'
      dark: '#0ca30c'
    warning:
      light: '#fab219'
      dark: '#fab219'
    negative:
      light: '#d03b3b'
      dark: '#d03b3b'
