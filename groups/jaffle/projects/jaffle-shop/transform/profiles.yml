jaffle_shop:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('PF_DUCKDB_PATH') }}"
      threads: 4
    ci:
      type: duckdb
      path: "{{ env_var('PF_DUCKDB_PATH') }}"
      threads: 8
    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', '') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD', '') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'SYSADMIN') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'COMPUTE_WH') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA', 'ANALYTICS') }}"
      threads: 8
    base:
      type: duckdb
      path: "{{ env_var('PF_DUCKDB_PATH') }}"
      schema: base
      threads: 4

# How the Elementary CLI (`edr`) reads the tables the dbt package writes.
# DERIVED from the project profile above by `pf tool elementary`: one
# elementary output per project target, schema suffixed the way dbt
# composes custom schemas, so `DBT_TARGET=prod edr report` reads the
# production warehouse and the default reads dev. Regenerated by
# `pf bootstrap` — retarget the project, not this block.
elementary:
  target: '{{ env_var(''DBT_TARGET'', ''dev'') }}'
  outputs:
    dev:
      type: duckdb
      path: '{{ env_var(''PF_DUCKDB_PATH'') }}'
      threads: 4
      schema: main_elementary
    ci:
      type: duckdb
      path: '{{ env_var(''PF_DUCKDB_PATH'') }}'
      threads: 8
      schema: main_elementary
    prod:
      type: snowflake
      account: '{{ env_var(''SNOWFLAKE_ACCOUNT'') }}'
      user: '{{ env_var(''SNOWFLAKE_USER'') }}'
      private_key_path: '{{ env_var(''SNOWFLAKE_PRIVATE_KEY_PATH'', '''') }}'
      password: '{{ env_var(''SNOWFLAKE_PASSWORD'', '''') }}'
      role: '{{ env_var(''SNOWFLAKE_ROLE'', ''SYSADMIN'') }}'
      warehouse: '{{ env_var(''SNOWFLAKE_WAREHOUSE'', ''COMPUTE_WH'') }}'
      database: '{{ env_var(''SNOWFLAKE_DATABASE'') }}'
      schema: '{{ env_var(''SNOWFLAKE_SCHEMA'', ''ANALYTICS'') }}_elementary'
      threads: 8
    base:
      type: duckdb
      path: '{{ env_var(''PF_DUCKDB_PATH'') }}'
      schema: base_elementary
      threads: 4
