# AI agent governance: prove the provenance chain, scan for the gaps it cannot
# see, then check both against a published control catalogue.
#
# Three checks that fail in different directions, which is why all three run:
#
#   `pf provenance verify` is *runtime* evidence. It reads the ledger this
#   platform actually wrote and asks whether it holds together — every record
#   hash-linked, every action gated before it ran, no denial that executed
#   anyway. It says nothing about code that has no ledger entries yet.
#
#   The ASQAV scanner (vendor/asqav-compliance) is *static* analysis. It reads
#   the agent code in the diff and asks whether the controls are present at all
#   — audit trail, policy enforcement, revocation, human oversight, error
#   handling — and maps them to EU AI Act, DORA and ISO 42001. It says nothing
#   about whether any of it ran.
#
#   `pf air` is the *catalogue*. The other two ask whether our controls work;
#   this one asks whether they are the right controls, against 23 risks and 23
#   mitigations published by FINOS and cross-walked to the EU AI Act, ISO
#   42001, NIST SP 800-53r5, OWASP and the rest. It is the only one of the
#   three that can report a control we never thought to build.
#
# A clean scan with a broken chain means the controls exist and are not working.
# A clean chain with a failing scan means the paths that are instrumented are
# sound and something new is not. Neither result is the other's evidence.
#
# The action is pinned as a submodule and run from the checkout (`uses: ./…`)
# rather than by tag. A tag is a moving reference: the code that judges our
# compliance would change without a commit here, which is the same objection
# this repo already makes to unpinned vendored upstreams. Bumping it is
# `git submodule update --remote` in a reviewed PR.
#
# The pin resolves against `Atomz-org/asqav-compliance`, our fork, because the
# original `jagmarques/asqav-compliance` was deleted on 18 September 2026 — the
# account with it. Same sha, `d57fccc`: a git object name hashes the tree and
# its whole history, so a repository that can produce it is producing the bytes
# we already ran, and nothing about what runs here changed with the url.
# `pf vendor why` and `docs/VENDOR.md` carry the provenance.
name: AI governance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # For the anchor check below, which asks a question about the repository
  # rather than about a change: has anybody timestamped the chain lately.
  schedule:
    - cron: "23 7 * * *"

permissions:
  contents: read
  pull-requests: write

# On a pull request the ref is the branch, so a new push should supersede the
# run it replaced. On `main` the ref is the same string for every merge, so the
# same rule made each merge cancel the audit of the merge before it — 17 of the
# 47 post-merge runs between 18 and 20 September died that way, and the faster
# the queue landed, the less of this ran. Pushes are keyed by commit instead, so
# every merge keeps its own record.
concurrency:
  group: ai-governance-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  provenance:
    name: Provenance chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync

      - name: Unit tests for the chain
        # The attack tests: edit a record, re-seal it, drop one, claim a denial
        # that ran. A chain whose tamper detection is broken would otherwise
        # report a clean ledger for the rest of this job.
        run: uv run pytest platform/tests/gate/test_provenance.py -q

      - name: Verify the ledger
        # Non-zero on a broken chain, an ungated execution, an unenforced
        # denial or a self-approval. Skipped rather than failed when the runner
        # has no ledger — CI checks out source, and a fresh checkout has no
        # runtime evidence in it, which is not the same as evidence that failed.
        run: |
          if [ -f provenance/chain.jsonl ]; then
            uv run pf provenance verify --anchors
          else
            echo "No ledger in this checkout — nothing to verify."
            echo "(The ledger is runtime state and is gitignored by design;"
            echo " archived evidence comes from \`pf provenance export\`.)"
          fi

      - name: Independent verifier
        # The same audit through the standalone stdlib script an auditor gets.
        # If these two ever disagree, the bundled verifier is the one that is
        # wrong in the way that matters, because it is the one shipped to people
        # who cannot check our work.
        run: |
          if [ -f provenance/chain.jsonl ]; then
            python3 platform/entrypoints/verify_provenance.py provenance
          fi

  # Stage 05 — TIMESTAMP. This job does not anchor, and cannot: the ledger is
  # `provenance/chain.jsonl`, which is gitignored runtime state, so a fresh
  # checkout has no chain to timestamp. Anchoring runs where the records are
  # written; see "Scheduling the anchor" in docs/GOVERNANCE.md.
  #
  # What CI *can* do is notice that nobody has. The anchor tokens are the one
  # thing under `provenance/` that is committed, precisely so an auditor gets
  # them alongside the chain — which also means this job can read them.
  #
  # Not on pull requests, and never blocking. A stale anchor is a fact about
  # the repository, not about the change under review: failing a PR for it
  # would block an author from merging over something they cannot fix, and the
  # fastest way to make that stop hurting is to stop anchoring.
  anchor:
    name: Timestamp anchor coverage
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Report the newest anchor
        env:
          # How old the newest token may be before this says so. The anchoring
          # cadence should be shorter than this; the gap between them is the
          # slack for a missed run.
          MAX_AGE_DAYS: ${{ vars.PROVENANCE_ANCHOR_MAX_AGE_DAYS || '2' }}
        run: |
          shopt -s nullglob
          tokens=(provenance/anchors/*.tsr)

          if [ ${#tokens[@]} -eq 0 ]; then
            echo "::warning title=Chain never anchored::No timestamp tokens are committed under provenance/anchors/. The chain is self-consistent, but its age rests entirely on this repository's own word. See 'Scheduling the anchor' in docs/GOVERNANCE.md."
            {
              echo "## Timestamp anchor coverage"
              echo
              echo "**Never anchored.** Stages 01-04 are intact and entirely ours;"
              echo "stage 05 is what removes us from the trust set, and it has not run."
              echo
              echo "\`pf provenance anchor\` writes a token here. It runs where the"
              echo "ledger lives, not in CI -- the chain is gitignored runtime state."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Zero-padded sequence numbers, so the last one sorted is the newest.
          newest=$(printf '%s\n' "${tokens[@]}" | sort | tail -1)

          # The token's own signed genTime, not the file's mtime: a git checkout
          # does not preserve mtimes, so the filesystem cannot answer this. The
          # timestamp is the one thing a TSA token exists to carry.
          stamped=$(openssl ts -reply -in "$newest" -text 2>/dev/null \
                    | sed -n 's/^ *Time stamp: *//p' | head -1)

          if [ -z "$stamped" ]; then
            echo "::warning title=Anchor unreadable::${#tokens[@]} token(s) present, but the newest ($newest) could not be read by openssl. The tokens are still valid evidence; only this report failed."
            exit 0
          fi

          now=$(date -u +%s)
          then_=$(date -u -d "$stamped" +%s 2>/dev/null || echo "")
          if [ -z "$then_" ]; then
            echo "::warning title=Anchor time unparsed::Newest anchor reads '$stamped', which this runner could not parse."
            exit 0
          fi
          age_days=$(( (now - then_) / 86400 ))

          {
            echo "## Timestamp anchor coverage"
            echo
            echo "| | |"
            echo "|---|--:|"
            echo "| tokens committed | ${#tokens[@]} |"
            echo "| newest | \`$(basename "$newest")\` |"
            echo "| stamped | $stamped |"
            echo "| age | ${age_days}d |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$age_days" -gt "$MAX_AGE_DAYS" ]; then
            echo "::warning title=Anchor is stale::The newest timestamp is ${age_days} days old (threshold ${MAX_AGE_DAYS}). Everything written since then rests on this repository's own word."
          else
            echo "Newest anchor is ${age_days}d old — within ${MAX_AGE_DAYS}d."
          fi

  compliance-scan:
    name: ASQAV compliance scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The scanner is pinned as a submodule and run from the checkout rather
      # than by tag, so the code judging our compliance cannot change without a
      # commit here. That pin was unreachable for two days: the upstream
      # `jagmarques/asqav-compliance` was deleted, account and all, and this job
      # went red on every pull request for a reason nobody here could fix. A
      # check like that teaches people to ignore the whole workflow — including
      # the two in it that do block.
      #
      # So the guard below stays even now that the pin resolves again. It is not
      # a workaround for that outage; it is what makes the next one cost a
      # warning instead of a fortnight. Read the warning as "no scan ran", never
      # as "no gaps found" — the two look identical from a green tick, which is
      # how the first disappearance went unnoticed. Nothing enforced is lost
      # either way, because this scan reports and never blocks.
      - name: Vendored scanner
        id: pin
        run: |
          if git submodule update --init vendor/asqav-compliance 2>/dev/null \
             && { [ -f vendor/asqav-compliance/action.yml ] || [ -f vendor/asqav-compliance/action.yaml ]; }; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=ASQAV scan skipped::vendor/asqav-compliance could not be checked out — its upstream no longer exists. The static scan did not run; the blocking checks are unaffected."
          fi

      - name: Scan agent code for governance gaps
        id: scan
        if: steps.pin.outputs.present == 'true'
        uses: ./vendor/asqav-compliance
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Reported, never enforced. The scanner is regex over source, so it
          # scores a file that merely mentions `revoke` the same as one that
          # implements a kill switch — useful as a prompt to look, wrong as a
          # merge gate. `pf provenance verify` above is the blocking check,
          # because it tests behaviour instead of vocabulary.
          fail-on-gaps: 'false'

      - name: Summary
        if: always()
        run: |
          echo "### AI agent governance scan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.pin.outputs.present }}" != "true" ]; then
            echo "**Not run.** \`vendor/asqav-compliance\` is unreachable — its upstream was deleted." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "This scan reports and never blocks. The checks that do block are unaffected:" >> "$GITHUB_STEP_SUMMARY"
            echo "\`pf provenance verify\` and \`pf air gate\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Compliance score | ${{ steps.scan.outputs.score }} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Agent files | ${{ steps.scan.outputs.agent-files }} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Gaps | ${{ steps.scan.outputs.gaps }} |" >> "$GITHUB_STEP_SUMMARY"
          fi

  air-baseline:
    name: AI control baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Load-bearing, and unique to this job: the control catalogue is vendored,
      # and without it every control assesses as `unexercised` and the gate
      # passes for the wrong reason. Initialised by name rather than with
      # `submodules: true`, so an unreachable pin elsewhere under `vendor/`
      # cannot take the blocking gate down with it. This step still fails the
      # job if the catalogue itself cannot be fetched, which is the point.
      - name: Vendored control catalogue
        run: git submodule update --init vendor/ai-governance-framework

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync

      - name: Unit tests for the catalogue
        run: uv run pytest platform/tests/gate/test_air.py -q

      - name: Verify the vendored corpus
        # Fails when a pin bump renamed a control, retired a risk something still
        # cites, or changed a `type:` letter — which silently renames the derived
        # id every air.yaml baseline refers to. This is what makes the registry's
        # `kind: data` coupling a claim the build can check.
        run: uv run pf air verify

      - name: Coverage
        # Reported, never enforced. The platform ships with controls it has not
        # built, and the honest thing is a summary that says which.
        run: uv run pf air coverage --markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Committed baselines
        # The blocking check. Each entity declares in its air.yaml which controls
        # it commits to; only those fail the merge, and only when a claiming
        # policy names enforcement that does not resolve. `unexercised` warns.
        run: |
          set -e
          for g in groups/*/; do
            group=$(basename "$g")
            [ -f "$g/air.yaml" ] || continue
            for p in "$g"projects/*/; do
              [ -d "$p" ] || continue
              uv run pf air gate "$group" "$(basename "$p")"
            done
          done
