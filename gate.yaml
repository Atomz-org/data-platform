# Machine-readable safety policy. Read by `pf gate`, the pre-commit hook and the
# PreToolUse hook. Modelled on loop-engineering's gate.yaml (vendor/loop-engineering).
#
# Hand-maintained. Capability-contributed rules live in the generated
# `gate.capabilities.yaml` and are merged at load time — nothing generated is
# written back into this file, so these comments survive.
#
# Keep in sync with loop-constraints.md when either changes.
version: 1

# Paths no agent may write, in any session.
# What the gate is shown, before any rule below applies.
#
# `platform/hooks/pre_commit.sh` selects staged paths with
# `--diff-filter=ACMR`: Added, Copied, Modified, Renamed. Renames were missing
# until they were found to be walking straight past every rule here — a
# rename-only commit reported "0 path(s)" and skipped the denylist, the maxFiles
# cap and impact analysis alike.
#
# Deletions (`D`) are still not shown, and that is a live question rather than a
# settled one. Including them would mean *deleting* a denylisted file is denied
# the same way editing it is, which is defensible — a generated file removed by
# hand lies as loudly as one edited by hand — but it is a widening of what this
# gate refuses, so it wants a decision rather than a quiet edit. The impact half
# is the stronger argument: `pf.capabilities.IMPACT_JOB` already reasons that a
# deleted model is the most dangerous change there is, because its consumers are
# still in the base graph.
denylist:
  - ".env"
  - ".env.*"
  - "**/secrets.toml"
  - "**/credentials/**"
  - "**/*_key*"
  - "**/*_secret*"
  - "**/.dlt/secrets.toml"
  # The provenance ledger (pf.provenance). An agent that can edit the record of
  # what it did has no record of what it did — the hash chain makes tampering
  # *evident*, and this makes it denied. The hooks write here directly rather
  # than through the Edit tool, so nothing legitimate is blocked by this rule.
  - "provenance/**"
  - "**/target/**"          # dbt build artefacts — generated, never hand-edited
  - "**/dbt_packages/**"
  - "**/kg/graph.duckdb"    # generated by `pf kg build`
  # Generated by `pf bootstrap` and machine specific: it holds absolute paths,
  # because Dagster resolves a relative working_directory against the process
  # cwd rather than against the file. Tracked, it recorded whose checkout ran
  # bootstrap last and conflicted on every onboarding.
  - "platform/workspace.yaml"
  - "**/kg/context_card.md" # generated by `pf kg card`
  # The Bloom export. All five files are written by `pf kg bloom` from the eight
  # project graphs; the two CSVs are also gitignored for their size, and these
  # three are committed because they are the reusable half. Hand-editing any of
  # them makes it disagree with the graph it claims to describe, and the next
  # regeneration discards the edit without saying so.
  - "docs/bloom/nodes.csv"
  - "docs/bloom/edges.csv"
  - "docs/bloom/load.cypher"
  - "docs/bloom/data-platform.bloom-perspective.json"
  - "docs/bloom/README.md"
  - "platform/workspace.yaml" # generated by `pf dagster-workspace`; machine-local paths
  # Regenerated around every dbt run by `pf.atlas`. Not committed either —
  # see .gitignore — because it stamps the graph build time, so carrying it
  # would rewrite eight files on every build and say nothing.
  - "**/kg/atlas.html"      # generated by `pf atlas`
  - "**/kg/atlas.prev.html"
  - "**/kg/architecture.md" # generated by `pf arch`
  # The harness maps — a group's, a project's, its reporting/'s. Written by
  # `pf harness` and by every `pf bootstrap` from the files that enforce what
  # they say: the settings, this file, the hooks, the workflows, the loops. A
  # hand edit is a map that disagrees with its territory; excepted below so
  # git carries it, like kg/architecture.md.
  - "**/HARNESS.md"         # generated by `pf harness`
  # The code graph, built by code-review-graph over platform/ only. Generated,
  # and large: a hand edit is meaningless and committing it is 60k lines of
  # build output. The marker README is excepted below — it is hand-written, and
  # it is the only reason the graph stops at platform/.
  - "platform/.code-review-graph/**"
  # The memory index. Generated by `pf memory index` from every module's
  # `.memory/notes/`; a hand edit makes it disagree with the notes it claims to
  # list, and `pf memory check` fails CI on the disagreement. The notes
  # themselves are hand-written and stay writable — `**/.memory/**` is in
  # autoMergeAllowlist below.
  - ".memory/MEMORY.md"
  # Rendered from toolkit templates by `pf evals-gen`. Hand-editing one makes it
  # disagree with the template it came from, and the next regeneration silently
  # discards the edit. Project-authored cases live one level up, in evals/cases/,
  # and stay editable.
  - "**/evals/cases/generated/**"
  - "**/data/*.duckdb"      # the warehouse itself
  # The quack dev server's state file (pf.runtime.quack): pid, port and the
  # session auth token. An agent that can rewrite it can point readers at a
  # different server or lift the token; the runtime writes it directly (0600)
  # and nothing legitimate edits it by hand.
  - "**/data/*.quack.json"
  # Dagster *runtime state* only. `.dagster/dagster.yaml` is deliberately not
  # denied: it is checked-in, hand-maintained instance config (the writer-pool
  # limits live there), and a blanket `.dagster/**` made it uneditable.
  - ".dagster/history/**"
  - ".dagster/storage/**"
  - ".dagster/logs/**"
  - ".dagster/schedules/**"
  - ".dagster/.*"

# Checked before the denylist, and only against it. `.env.*` must catch
# `.env.local` and `.env.production`; it also caught `.env.example`, which is a
# committed template with no secret in it and the one file someone edits when
# adding a variable. `pf check` flags every denied path git is tracking, so an
# exception here is a deliberate, visible statement rather than a silent hole.
denylist_except:
  - ".env.example"
  # Hand-written, and load-bearing: without it the marker directory does not
  # exist in a clone and the code graph silently spans every sister project.
  - "platform/.code-review-graph/README.md"

  # --- review artefacts, deliberately committed -----------------------------
  #
  # These are generated, and they are checked in anyway. The denylist entries
  # that cover them (contributed by pf.tools.wren and pf.tools.recce, see
  # gate.capabilities.yaml) exist to stop an agent *hand-editing* them, and that
  # still holds — nothing here says "edit these", it says "git may carry them".
  #
  # Why carry them:
  #   mdl/mdl.json        is the semantic contract an external consumer reads.
  #                       A contract nobody can diff in a pull request is a
  #                       contract that changes without anyone noticing.
  # The recce artefacts used to be listed here too — recce_state.json,
  # recce_summary.md and target-base/**. They are not any more, and the note
  # above predicted exactly why:
  #
  #   "If that becomes the dominant noise in reviews, the fix is to drop these
  #    four lines and untrack them, not to hand-edit them."
  #
  # jaffle-shop made it 30 MB rewritten on every run, so that is what happened.
  # They live in the artefact store now (docs/ARTIFACTS.md) — pushed by whoever
  # builds them, pulled by CI and the control plane — and git carries none of
  # them. The **denylist** entries contributed by pf.tools.recce stay exactly as
  # they were: hand-editing a recorded diff still makes the review lie, and it
  # makes it lie whether the file is in git or in a bucket.
  #
  # The PII exclusion in pf.tools.recce also stays, and matters more now rather
  # than less: `value_diff` writes compared rows into recce_state.json, and that
  # file is now uploaded to shared object storage rather than sitting in a
  # checkout. It was what made the file safe to commit; it is what makes it safe
  # to publish.
  - "**/mdl/mdl.json"

  # Dagster's first-run marker. Already tracked, no secret in it, and leaving it
  # denied made `pf check` report drift forever over a file nobody edits.
  - ".dagster/.nux/nux.yaml"

  # The reusable half of the Bloom export. `pf kg bloom` writes five files; the
  # two CSVs are ~6MB that changes on every graph rebuild and are gitignored,
  # and these three are small, deterministic and the artefacts somebody actually
  # reuses — the perspective is what makes 13,000 nodes legible, and a
  # perspective nobody can diff is one that drifts from the graph unnoticed.
  #
  # Their denylist entries stay: nothing here says "edit these", it says "git
  # may carry them". Hand-editing the perspective still makes it disagree with
  # the graph, and the next `pf kg bloom` discards the edit without a word.
  - "docs/bloom/load.cypher"
  - "docs/bloom/data-platform.bloom-perspective.json"
  - "docs/bloom/README.md"

  # The catalogue projection, for the same reason mdl.json is carried: a pull
  # request that changes a concept then shows exactly what the catalogue will
  # say about it, before anyone publishes. Both are small and deterministic —
  # no timestamps — so they diff cleanly, unlike the recce artefacts above.
  #
  # The ingestion workflows hold env-var references, never a JWT and never a
  # warehouse password. That is worth carrying in review rather than hiding:
  # `catalog/ingestion/database.yaml` names the production warehouse this
  # project catalogues, and a change to it is a change to what an entire company
  # can see about its own data. `**/catalog/ingestion.yaml` stays listed because
  # projects predating the split still have one until `pf bootstrap` removes it.
  - "**/catalog/ingestion/**"
  - "**/catalog/ingestion.yaml"
  - "**/catalog/openmetadata.json"

  # CI workflows. `pf.capabilities.github` denies `**/.github/workflows/**` so an
  # agent cannot hand-edit the gate that judges it, and that intent is unchanged.
  # But a workflow is now *generated*: `pf bootstrap` composes one per project
  # from the `ci_jobs` each capability declares, and GitHub only runs what is
  # committed. Denied and untrackable meant the merge gate could be regenerated
  # and never actually run — a control that exists on disk and nowhere else.
  #
  # Hand-editing one is still wrong, and still pointless: the next bootstrap
  # overwrites it. Change the capability that contributes the job.
  - ".github/workflows/**"

  # The per-project architecture map, for the reason mdl.json is carried: a pull
  # request that adds an exposure or removes a metric then shows what that did
  # to the shape of the project, in the diff, next to the change.
  #
  # It is carried and `kg/context_card.md` is not, and the difference is a
  # single line: the card stamps its generation date, so committing it would
  # rewrite eight files every day and say nothing. The map has no date by
  # design, so it changes when the project changes — which is what makes
  # `pf arch --check` a CI gate rather than a local convenience.
  - "**/kg/architecture.md"

  # The harness maps, for the reason the architecture map is carried: a pull
  # request that enables a tool or silences a loop then shows what that did
  # to what an agent may do there, in the diff, next to the change. The maps
  # say the rest themselves: an exception here is matched before the denylist,
  # so the hook allows a hand edit and `pf harness check` in CI is what
  # catches it.
  - "**/HARNESS.md"

  # The memory index, carried for the reason the test index is: a pull request
  # that adds a lesson then shows, in one diff, where it landed and what it
  # says. Regenerated by `pf memory index`; `pf memory add` does it for you.
  - ".memory/MEMORY.md"

# Paths a *project* session may not write. Platform infra is shared: a change
# made while working on one company silently affects every other.
platform_denylist:
  - "platform/**"
  - "vendor/**"
  - "pyproject.toml"
  - "uv.lock"
  - "gate.yaml"
  - "gate.capabilities.yaml"

# Changing these requires the blast radius to be reported first.
impact_required:
  - "**/transform/models/**/*.sql"
  - "**/transform/macros/**/*.sql"
  - "**/transform/models/**/*.yml"
  - "**/src/*/sources/*.py"

# Safe to change without a gate.
autoMergeAllowlist:
  - "**/*.md"
  - "**/*.sql" 
  - "**/decisions/**"
  - "**/.memory/**"
  - "**/evals/cases/**"
  - '**/transform/macros/**'

# A feature and its evidence land together.
#
# pytest and the contract evals already say whether the suite is green. What
# nothing said was whether a change *has* a suite: a new module under
# platform/src/pf with no test, or a new skill with no eval case, passed every
# check there was by having nothing to fail — the same hole `pf group verify`
# closed for groups. Each pair names a source root and the root where its
# evidence lives. A run that ADDS a source path and touches nothing under the
# paired evidence root is refused; a run that only modifies one is warned.
# `scope` is how many leading path segments a source hit and an evidence hit
# must share, so a skill in one toolkit is not covered by an eval in another.
# Deleted paths are never shown to the gate (see the note at the top), so a
# deleted test cannot count as evidence. The rule that a test must fail before
# the change and pass after it is review's to keep; a gate cannot tell a real
# test from a tautology.
tests_required:
  - source: "platform/src/pf/**/*.py"
    evidence: "platform/tests/**/*.py"
  - source: "platform/hooks/**"
    evidence: "platform/tests/**/*.py"
  - source: "platform/toolkits/*/skills/**"
    evidence: "platform/toolkits/*/evals/**"
    scope: 3

# A change to a scope lands with its harness map current.
#
# HARNESS.md in a group, a project and its reporting/ is generated by
# `pf harness` from the files that enforce what it says: the scope's settings,
# this file, the hooks, its workflow, its loops, its tools. A run that changes
# any of those and leaves the map behind ships a map that lies about the
# change beside it; `pf harness check` in CI catches that a round trip later
# than this does. Judged on currency, never on presence: a run whose change
# leaves a map identical needs nothing, a run whose change alters one must
# carry the regenerated map in the same run, and a map regenerated on disk but
# not staged is refused the same way, because the commit would lack it.
#
# Each entry names the paths that make up a scope and the maps a change there
# can alter; `{group}` and `{project}` are bound from the path, and `**` under
# a group means every map in the family. The first entry a path matches is the
# one that judges it, so a project change reaches its own map, its report's and
# the group's (where its sister row lives), not its sisters'. A group-level
# change — loops, tools, notify, air, a skill — reaches every map in the family.
harness_required:
  - scope: "groups/*/projects/*/**"
    maps:
      - "groups/{group}/projects/{project}/HARNESS.md"
      - "groups/{group}/projects/{project}/reporting/HARNESS.md"
      - "groups/{group}/HARNESS.md"
  - scope: "groups/*/**"
    maps:
      - "groups/{group}/**/HARNESS.md"

# A single loop run may not touch more than this many files.
maxFiles: 12

# Severity at which a change is blocked rather than warned.
blockOn: breaking
