  # -------------------------------------------------------------- topology --
  - id: opentopology
    summary: "the traceability chain: intent → constraint → artifact → evidence"
    name: OpenTopology (otop-core)
    url: https://github.com/opentopology/opentopology
    path: vendor/opentopology
    branch: main
    licence: Apache-2.0
    role: spec
    why: >
      otop's contribution is not entity modelling — it is the traceability chain
      intent -> constraint -> artifact -> evidence. That is what turns "we have a
      PII rule" into "here is the check, and here is the run that proves it fired".
    adopted:
      - upstream: schemas/otop-core-v0.2.schema.json
        kind: schema
        ours:
          - platform/src/pf/projections/otop.py
          - platform/src/pf/ontology/policy.yaml
        note: >
          Our policy layer is emitted as an otop 0.2 manifest and validated
          against this exact file. If upstream tightens the schema, the export
          fails here rather than in a consumer.
      - upstream: specs/otop-core-0.2.md
        kind: shape
        ours: [platform/src/pf/ontology/policy.yaml]
        note: >
          Relationship vocabulary taken verbatim: governed_by, implemented_by,
          verified_by. Renaming them locally would break every otop consumer.
    declined:
      - what: signatures / attestation blocks
        why: >
          Nothing signs evidence in this platform yet. An unsigned signature block
          is worse than none — it implies a guarantee that does not exist.
      - what: otop-core-0.1 schema
        why: Superseded by 0.2. We track one version so there is one answer to "does this conform".

