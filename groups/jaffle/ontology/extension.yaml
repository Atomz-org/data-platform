    label: AccountReceivable
    description: Induced from `raw_accounts_receivable` and approved by onboarding-ladder.
    identity: id
    properties:
      id:
        datatype: integer
        role: natural_key
        required: true
      customer_id:
        datatype: integer
        role: foreign_key
        required: true
