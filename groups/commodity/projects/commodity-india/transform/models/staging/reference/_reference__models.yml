version: 2

models:
  - name: stg_reference__commodities
    description: >
      Every commodity the tracker prices, with its benchmark, exchange and the unit the benchmark is quoted per. Cleaned 1:1 from `reference.commodities`; grain: one tracked commodity.
    meta:
      concept: Commodity
      grain: one tracked commodity
      layer: staging
    columns:
      - name: commodity_id
        meta: {role: natural_key}
        data_tests: [unique, not_null]
      - name: commodity_name
        meta: {role: free_text}
      - name: category
        meta: {role: status_enum}
      - name: segment
        meta: {role: status_enum}
      - name: exchange
        meta: {role: status_enum}
      - name: quote_unit
        meta: {role: unit_of_measure}
      - name: price_basis
        meta: {role: status_enum}
      - name: yahoo_symbol
        meta: {role: free_text}
      - name: spot_symbol
        meta: {role: free_text}
