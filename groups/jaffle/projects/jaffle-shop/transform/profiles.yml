jaffle_shop:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('PF_DUCKDB_PATH') }}"
      threads: 4
    ci:
      type: duckdb
      path: "{{ env_var('PF_DUCKDB_PATH') }}"
      threads: 8
    prod:
      type: duckdb
      path: "ducklake:{{ env_var('DUCKLAKE_METADATA') }}"
      schema: "{{ env_var('DUCKLAKE_SCHEMA', 'analytics') }}"
      extensions: [ducklake, httpfs]
      threads: "{{ env_var('DUCKLAKE_THREADS', '1') | int }}"
    base:
      type: duckdb
      path: "{{ env_var('PF_DUCKDB_PATH') }}"
      schema: base
      threads: 4

# How the Elementary CLI (`edr`) reads the tables the dbt package writes.
# DERIVED from the project profile above by `pf tool elementary`: one
# elementary output per project target, schema suffixed the way dbt
# composes custom schemas, so `DBT_TARGET=prod edr report` reads the
# production warehouse and the default reads dev. Regenerated by
# `pf bootstrap` — retarget the project, not this block.
elementary:
  target: '{{ env_var(''DBT_TARGET'', ''dev'') }}'
  outputs:
    dev:
      type: duckdb
      path: '{{ env_var(''PF_DUCKDB_PATH'') }}'
      threads: 4
      schema: main_elementary
    ci:
      type: duckdb
      path: '{{ env_var(''PF_DUCKDB_PATH'') }}'
      threads: 8
      schema: main_elementary
    prod:
      type: duckdb
      path: ducklake:{{ env_var('DUCKLAKE_METADATA') }}
      schema: '{{ env_var(''DUCKLAKE_SCHEMA'', ''analytics'') }}_elementary'
      extensions:
      - ducklake
      - httpfs
      threads: '{{ env_var(''DUCKLAKE_THREADS'', ''1'') | int }}'
    base:
      type: duckdb
      path: '{{ env_var(''PF_DUCKDB_PATH'') }}'
      schema: base_elementary
      threads: 4
