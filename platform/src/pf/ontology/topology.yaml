# Canonical relationships between ontology classes, independent of any warehouse.
# `x-links-to` annotations on dlt columns are validated against these edges, and
# the knowledge graph derives business-level lineage from them.
version: 1

edges:
  - { from: Customer,     to: Organization, type: belongs_to,  cardinality: "N:1" }
  - { from: Customer,     to: Subscription, type: holds,       cardinality: "1:N" }
  - { from: Customer,     to: Order,        type: places,      cardinality: "1:N" }
  - { from: Customer,     to: Location,     type: located_in,  cardinality: "N:1" }
  - { from: Customer,     to: Interaction,  type: participates,cardinality: "1:N" }
  - { from: Customer,     to: Payment,      type: pays,        cardinality: "1:N" }
  - { from: Subscription, to: Payment,      type: settled_by,  cardinality: "1:N" }
  - { from: Subscription, to: Product,      type: for_product, cardinality: "N:1" }
  - { from: Subscription, to: Usage,        type: metered_by,  cardinality: "1:N" }
  - { from: Order,        to: Payment,      type: settled_by,  cardinality: "1:N" }
  - { from: Order,        to: Product,      type: contains,    cardinality: "N:M" }
  - { from: Payment,      to: Refund,       type: reversed_by, cardinality: "1:N" }
  - { from: Payment,      to: Currency,     type: denominated, cardinality: "N:1" }
  - { from: Contract,     to: Organization, type: signed_by,   cardinality: "N:1" }
