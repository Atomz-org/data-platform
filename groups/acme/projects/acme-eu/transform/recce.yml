# GENERATED by `pf bootstrap`. Do not edit.
#
# Every check below is derived, not written:
#
#   contracts/annotations.yaml   column -> ontology role
#   ontology concepts.yaml       role   -> review intent, pii flag
#   pf.tools.recce               intent -> check type
#
# So the way to change a check is to fix what the column *means*, not
# to edit here: a wrong check is a wrong role. Columns whose role is
# PII are excluded from every value-level check, because this file's
# results land in recce_state.json, which is durable and shared.
#
# Regenerate with `pf tool recce config <group> <project>`.
checks:
- name: Row count diff
  description: Row counts for every modified table model.
  type: row_count_diff
  params:
    select: state:modified,config.materialized:table
- name: Schema diff
  description: Column additions, removals and type changes.
  type: schema_diff
- name: "Value diff \u2014 dim_customers"
  description: Row-level differences in dim_customers (one customer), keyed on customer_id.
  type: value_diff
  params:
    model: dim_customers
    primary_key: customer_id
- name: "Value diff \u2014 fct_payments"
  description: Row-level differences in fct_payments (one payment attempt), keyed
    on payment_id.
  type: value_diff
  params:
    model: fct_payments
    primary_key: payment_id
- name: "Profile diff \u2014 fct_payments"
  description: Distribution of amount (one payment attempt). A shifted total is the
    failure lineage cannot predict.
  type: profile_diff
  params:
    model: fct_payments
    columns:
    - amount
- name: "Profile diff \u2014 fct_revenue"
  description: Distribution of net_amount (one day x segment x plan). A shifted total
    is the failure lineage cannot predict.
  type: profile_diff
  params:
    model: fct_revenue
    columns:
    - net_amount
