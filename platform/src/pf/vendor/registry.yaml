          - platform/toolkits/dbt-govern/skills/troubleshoot-runs/SKILL.md
          - platform/src/pf/loops/registry.py
        note: Upstream's triage taxonomy is what the test-failure-triage loop classifies into.
      - upstream: skills/dbt-migration/skills/upgrading-dbt-core/SKILL.md
        kind: port
        ours: [platform/toolkits/dbt-migrate/skills/upgrade-and-migrate/SKILL.md]
      - upstream: skills/dbt-migration/skills/migrating-dbt-core-to-fusion/SKILL.md
        kind: port
