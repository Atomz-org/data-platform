        why: >
          We ship our own MCP server. It exposes dbt alongside the graph, metrics
          and impact analysis behind one truncation policy; two servers would give
          an agent an ungoverned second route to the warehouse.
      - what: skills/dbt/skills/working-with-dbt-mesh/SKILL.md
        why: >
          `groups/` is our mesh. Cross-entity access is the roll-up project's
          ATTACH READ_ONLY, which is enforceable; mesh refs are not.
      - what: skills/dbt/skills/using-dbt-state/SKILL.md
        why: >
          State comparison answers "what changed". The knowledge graph answers
          "what breaks", which is the question the merge gate asks.
      - what: skills/dbt-extras/skills/creating-mermaid-dbt-dag/SKILL.md
        why: >
          The graph is already the DAG, and the UI renders it. A second rendering
          path drifts from the first.
      - what: skills/dbt-migration/skills/migrating-dbt-project-across-platforms/SKILL.md
