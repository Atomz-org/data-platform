unmodelled:
  raw_supplies: 'Junction table, not an entity: 29 supplies x 10 SKUs = 65 rows, so
    no column identifies a row and (id, sku) is a compound bridge key. The entity
    is the supply (id); this table is its many-to-many with Product. Model it as a
    relation once the topology names that verb.'
