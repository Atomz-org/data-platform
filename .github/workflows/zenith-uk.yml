# GENERATED by `pf bootstrap`. Every CI job zenith/zenith-uk runs, in one
# place. Do not hand-edit: the next bootstrap regenerates it, and the edit is
# lost. Change the capability that contributes the job instead — `pf.capabilities`
# for platform features, `pf.tools.<tool>` for a tool.
#
# The `changes` job diffs the PR once and publishes one boolean per area; every
# job below guards on it, so touching a page never starts a dbt review. Adding a
# capability adds a job here and nothing else.
name: zenith-uk

on:
  pull_request:
    paths:
      - "groups/zenith/projects/zenith-uk/**"

# One run per PR per project. A push that supersedes an in-flight run cancels it
# rather than racing it — two builds of the same project writing the same
# baseline is how a review compares against the wrong state.
concurrency:
  group: zenith-uk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.areas.outputs.models }}
      sources: ${{ steps.areas.outputs.sources }}
      transform: ${{ steps.areas.outputs.transform }}
      reporting: ${{ steps.areas.outputs.reporting }}
      any: ${{ steps.areas.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The diff is against the merge base, which a shallow clone does not
          # have. Every job below depends on this being right.
          fetch-depth: 0
      - id: areas
        run: |
          P="groups/zenith/projects/zenith-uk"
          BASE="origin/${{ github.base_ref }}"
          touched() {
            if [ -n "$(git diff --name-only "$BASE"...HEAD -- "$1")" ]; then
              echo true
            else
              echo false
            fi
          }
          echo "models=$(touched "$P/transform/models")" >> "$GITHUB_OUTPUT"
          echo "sources=$(touched "$P/src")" >> "$GITHUB_OUTPUT"
          echo "transform=$(touched "$P/transform")" >> "$GITHUB_OUTPUT"
          echo "reporting=$(touched "$P/reporting")" >> "$GITHUB_OUTPUT"
          echo "any=$(touched "$P")" >> "$GITHUB_OUTPUT"

  # The merge gate, in CI. Runs the same `pf impact-gate` the developer's
  # pre-commit hook runs, so a change that bypassed the local hook (--no-verify,
  # a web edit, a bot commit) still cannot merge without its blast radius being
  # reported.
  impact-gate:
    needs: changes
    if: needs.changes.outputs.models == 'true' || needs.changes.outputs.sources == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # impact needs the merge base, not a shallow clone
      - uses: astral-sh/setup-uv@v5
      - run: uv sync

      - name: Models this PR touches
        id: changed
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            -- 'groups/zenith/projects/zenith-uk/transform/models/**/*.sql' \
            | xargs -r -n1 basename | sed 's/\.sql$//' | sed 's/^/model:/' | paste -sd, -)
          [ -z "$CHANGED" ] && echo "no model changes"
          echo "models=$CHANGED" >> "$GITHUB_OUTPUT"

      # Gate against the *base*, not the branch. The question a merge gate
      # answers is "what does this break in zenith/zenith-uk as it stands",
      # and only the base graph can answer it:
      #
      #   a model this PR adds is not in the base graph, so it has no blast
      #     radius and does not block — gated against the branch instead, every
      #     new model blocks on the new models added beside it, which makes the
      #     gate unusable for exactly the changes that need reviewing most
      #   a model this PR deletes still is in the base graph, so its consumers
      #     are found — gated against the branch it resolves to nothing and the
      #     most dangerous change there is passes silently
      #
      # `pf kg build` parses the dbt project first. Without a manifest the graph
      # holds no models, every blast-radius query comes back empty, and the gate
      # passes because it found nothing rather than because there is nothing.
      - name: Blast radius against the base
        if: steps.changed.outputs.models != ''
        run: |
          git checkout --detach origin/${{ github.base_ref }}
          if [ ! -f "groups/zenith/projects/zenith-uk/transform/dbt_project.yml" ]; then
            echo "zenith/zenith-uk does not exist on ${{ github.base_ref }} yet — nothing there to break"
            exit 0
          fi
          uv run pf kg build zenith zenith-uk
          uv run pf impact-gate zenith zenith-uk "${{ steps.changed.outputs.models }}"

  # dbt review: what the change did to the data, not just to the DAG.
  #
  # Two upstream pieces, both pinned as submodules under vendor/recce:
  #   DataRecce/PR-Update  keeps the branch merged with its base, so the diff is
  #                        against current code rather than against something the
  #                        base branch already replaced
  #   DataRecce/recce      runs the preset checks and writes the summary
  #
  # autoMerge is deliberately false. A merge is a write to someone's branch, and
  # the platform's rule is that automation reports while a human merges.
  recce:
    needs: changes
    if: needs.changes.outputs.transform == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the branch contains its base
        uses: DataRecce/PR-Update@main
        with:
          autoMerge: 'false'

      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra recce

      - name: Diff against the base build
        run: uv run pf tool recce ci zenith zenith-uk

      - name: Publish the summary
        if: always()
        run: |
          F=groups/zenith/projects/zenith-uk/transform/recce_summary.md
          [ -f "$F" ] && cat "$F" >> $GITHUB_STEP_SUMMARY || echo "no summary" >> $GITHUB_STEP_SUMMARY
