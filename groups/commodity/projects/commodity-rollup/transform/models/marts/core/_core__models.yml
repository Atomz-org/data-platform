version: 2

models:
  - name: dim_markets
    description: >
      Every market registered in the group's `markets` seed, with whether its
      sister is reporting and what the roll-up has received from it.
    access: public
    meta: {concept: Market, grain: one market}
    columns:
      - name: market_code
        meta: {role: natural_key}
        data_tests: [unique, not_null]
      - name: country_code
        meta: {role: geo_country}
        data_tests: [not_null]
      - name: currency_code
        meta: {role: currency_code}
        data_tests: [not_null]
      - name: is_reporting
        description: The sister has landed at least one price; false is a registered market nobody has seeded.
        data_tests: [not_null]
      - name: latest_price_date
        meta: {role: event_time}

  - name: dim_commodities
    description: The group catalog as every market sees it, with how many markets currently price each commodity.
    access: public
    meta: {concept: Commodity, grain: one commodity}
    columns:
      - name: commodity_id
        meta: {role: natural_key}
        data_tests: [unique, not_null]
      - name: category
        meta: {role: status_enum}
        data_tests:
          - accepted_values:
              arguments:
                values: [precious, industrial, energy, agri]
      - name: price_basis
        meta: {role: status_enum}
      - name: quote_unit
        meta: {role: unit_of_measure}
        data_tests: [not_null]
      - name: markets_pricing
        meta: {role: quantity}

  - name: fct_landed_prices_daily
    description: >
      Every market's daily landed price side by side: as the market reports it
      (its currency per its unit) and in USD per the benchmark's quote unit, with
      the import-parity premium each market adds over the benchmark. Prices are
      non-additive: aggregate within one commodity and one market.
    access: public
    meta: {concept: PriceObservation, grain: one commodity per market per price date}
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [market_code, commodity_id, price_date]
    columns:
      - name: landed_price_id
        meta: {role: natural_key}
        data_tests: [unique, not_null]
      - name: market_code
        meta: {role: foreign_key, links_to: Market}
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_markets')
                field: market_code
      - name: commodity_id
        meta: {role: foreign_key, links_to: Commodity}
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_commodities')
                field: commodity_id
      - name: price_date
        meta: {role: event_time}
        data_tests: [not_null]
      - name: currency_code
        meta: {role: currency_code}
        data_tests: [not_null]
      - name: benchmark_price_usd
        meta: {role: unit_price}
        data_tests: [not_null]
      - name: usd_fx_rate
        meta: {role: exchange_rate}
        data_tests: [not_null]
      - name: landed_price_local
        meta: {role: unit_price}
      - name: landed_price_usd_per_quote_unit
        meta: {role: unit_price}
        data_tests:
          - not_null:
              config:
                where: "not is_import_prohibited"
      - name: import_parity_premium_pct
        description: landed USD per quote unit over the benchmark, minus one. Duty, plus FX timing where a fix was carried forward.
        meta: {role: rate_fraction}

  - name: fct_market_spreads_daily
    description: >
      On days at least two markets priced a commodity: each market's landed
      price in USD per quote unit against the cheapest market's, as a spread and
      a percentage. Pure market effects — duty regimes and FX timing — because
      both sides stand on the same benchmark.
    access: public
    meta: {concept: PriceObservation, grain: one commodity per market per price date}
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [market_code, commodity_id, price_date]
    columns:
      - name: landed_price_id
        meta: {role: natural_key}
        data_tests: [unique, not_null]
      - name: market_code
        meta: {role: foreign_key, links_to: Market}
      - name: commodity_id
        meta: {role: foreign_key, links_to: Commodity}
      - name: price_date
        meta: {role: event_time}
      - name: cheapest_market_code
        meta: {role: foreign_key, links_to: Market}
        data_tests: [not_null]
      - name: spread_to_cheapest_usd
        meta: {role: unit_price}
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: spread_to_cheapest_pct
        meta: {role: rate_fraction}
      - name: is_cheapest_market
        data_tests: [not_null]

  - name: rpt_market_comparison_board
    description: >
      One row per commodity per market: the latest landed price on the
      benchmark's footing, the cheapest market to land it in, each market's
      spread to it, and how old each market's number is. The table behind the
      market comparison board.
    access: public
    meta: {grain: one commodity per market}
    columns:
      - name: board_row_id
        meta: {role: natural_key}
        data_tests: [unique, not_null]
      - name: market_code
        meta: {role: foreign_key, links_to: Market}
      - name: commodity_id
        meta: {role: foreign_key, links_to: Commodity}
      - name: category
        meta: {role: status_enum}
      - name: landed_price_usd_per_quote_unit
        meta: {role: unit_price}
      - name: spread_to_cheapest_pct
        meta: {role: rate_fraction}
      - name: is_stale
        description: That market's latest benchmark is more than four days old.

unit_tests:
  - name: markets_compare_on_the_benchmark_footing
    description: >
      India lands gold at ₹15,292.97/g on a $4,310.80/oz benchmark at 95.95:
      back in USD per troy ounce that is $4,957.42, a 15% premium — the duty.
      The US lands the same ounce duty-free at the benchmark itself.
    model: fct_landed_prices_daily
    given:
      - input: ref('int_landed_prices__usd_per_quote_unit')
        rows:
          - {landed_price_id: "IN:gold:2026-09-16", market_code: IN, commodity_id: gold, price_date: 2026-09-16, benchmark_price_usd: 4310.8, landed_price_usd_per_quote_unit: 4957.42, is_import_prohibited: false}
          - {landed_price_id: "US:gold:2026-09-16", market_code: US, commodity_id: gold, price_date: 2026-09-16, benchmark_price_usd: 4310.8, landed_price_usd_per_quote_unit: 4310.8, is_import_prohibited: false}
    expect:
      rows:
        - {landed_price_id: "IN:gold:2026-09-16", import_parity_premium_pct: 0.15}
        - {landed_price_id: "US:gold:2026-09-16", import_parity_premium_pct: 0.0}

  - name: the_cheapest_market_sets_the_spread
    description: Aluminium at 50% in the US and 7.5% in India — India is cheapest, the US pays 39.5% over it.
    model: fct_market_spreads_daily
    given:
      - input: ref('fct_landed_prices_daily')
        rows:
          - {landed_price_id: "IN:aluminium:2026-09-16", market_code: IN, commodity_id: aluminium, price_date: 2026-09-16, quote_unit: metric_ton, landed_price_usd_per_quote_unit: 2795.0}
          - {landed_price_id: "US:aluminium:2026-09-16", market_code: US, commodity_id: aluminium, price_date: 2026-09-16, quote_unit: metric_ton, landed_price_usd_per_quote_unit: 3900.0}
          - {landed_price_id: "IN:gold:2026-09-16", market_code: IN, commodity_id: gold, price_date: 2026-09-16, quote_unit: troy_oz, landed_price_usd_per_quote_unit: 4957.42}
    expect:
      rows:
        - {landed_price_id: "IN:aluminium:2026-09-16", markets_compared: 2, cheapest_market_code: IN, is_cheapest_market: true, spread_to_cheapest_usd: 0.0, spread_to_cheapest_pct: 0.0}
        - {landed_price_id: "US:aluminium:2026-09-16", markets_compared: 2, cheapest_market_code: IN, is_cheapest_market: false, spread_to_cheapest_usd: 1105.0, spread_to_cheapest_pct: 0.395349}

  - name: a_market_undoes_its_own_fx_and_unit
    description: >
      ₹15,292.9672 per gram at 95.95 INR/USD is $4,957.42 per troy ounce. The
      intermediate carries full precision; the mart rounds to six places.
    model: int_landed_prices__usd_per_quote_unit
    given:
      - input: ref('stg_sisters__landed_prices')
        rows:
          - {landed_price_id: "IN:gold:2026-09-16", market_code: IN, commodity_id: gold, price_date: 2026-09-16, quote_unit: troy_oz, market_unit: g, currency_code: INR, benchmark_price_usd: 4310.8, usd_fx_rate: 95.95, landed_price_local: 15292.9672, is_import_prohibited: false}
      - input: ref('units_of_measure')
        rows:
          - {unit_code: troy_oz, base_units_per_unit: 0.0311034768}
          - {unit_code: g, base_units_per_unit: 0.001}
    expect:
      rows:
        - {landed_price_id: "IN:gold:2026-09-16", landed_price_usd_per_quote_unit: 4957.420015720281}
