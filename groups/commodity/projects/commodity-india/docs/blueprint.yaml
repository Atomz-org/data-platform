column_focus:
- model: rpt_mcx_commodity_board
  column: premium_to_landed_pct
  why: 'Where MCX meets import parity: the MCX quote against the landed price per lot.'
- model: rpt_mcx_commodity_board
  column: return_1d
  why: 'Daily return on the board: MCX settlement through the continuous back-adjusted series.'
- model: rpt_mcx_commodity_board
  column: rsi_14
  why: RSI(14), computed on roll-free adjusted prices in the smoothed-indicators model.
- model: fct_landed_prices_daily
  column: landed_price_local
  why: 'Landed rupee price: benchmark × USD/INR × (1 + duty), from Yahoo Finance and the reference seeds.'
- model: rpt_mcx_commodity_board
  column: put_call_ratio_oi
  why: 'Options positioning: put/call ratio by open interest from the options bhavcopy.'
principles:
- - Business logic does not cross entities
  - Each project has its own warehouse, dlt, dbt and graph; only the rollup reads sisters, READ_ONLY.
  - Never read another group or sister project.
- - dlt lands raw, dbt owns meaning
  - No transformation in a dlt resource; staging never joins.
  - ADR-0004
- - Prices are unit_price, not money
  - Prices are non-additive; means are ratio metrics within one commodity.
  - ADR-0002, ADR-0003
- - Joins come from the ontology
  - A realises edge binds a physical FK to a named relation; MDL join conditions are derived, not guessed.
  - projections/mdl.py
- - Generated files come from generators
  - Docs, indexes, MDL, pages and cards are regenerated, never hand-edited.
  - pre-commit gate
- - Agent actions are recorded
  - Intent, decision and execution are chained and anchored; agents cannot edit the record.
  - docs/GOVERNANCE.md
- - Controls are named, not asserted
  - Each control carries a FINOS AIR id; coverage is derived at check time.
  - docs/AIR.md
- - Rerun anything, converge the same
  - Every Dagster step is idempotent; dlt resumes from cursors.
  - defs/mcx.py
building_blocks:
- - Data acquisition
  - dlt Core 1.x
  - commodity_india.mcx_feed, commodity_shared connectors
  - One pipeline per MCX commodity; merge on natural key; resumable batches
- - Warehouse
  - DuckDB
  - data/commodity_india.duckdb
  - One file per project; writer pool limit 1
- - Transformation
  - dbt Core + dbt-duckdb
  - transform/ (commodity_india + commodity_shared)
  - Models, tests and seeds (main_reference)
- - Data diff review
  - Recce
  - transform/recce.yml, target-base
  - PR-time data diff; servers on demand :8100+
- - Metrics
  - MetricFlow
  - semantic models in transform/models
  - Ratio means per ADR-0003
- - Knowledge graph
  - pf kg (DuckDB + JSON)
  - kg/graph.json
  - Models, columns + roles, metrics, concepts, policies, decisions
- - Semantic projection
  - pf semantic mdl
  - mdl/mdl.json
  - Models, relationships and one cube per metric-bearing model
- - Knowledge bundle
  - OKF
  - okf/tables/*.md
  - One page per table, linked to its kg node
- - BI
  - Evidence 40 (Svelte 4)
  - reporting/
  - Static prerendered site; fmt-rendered audit
- - Conversational analytics
  - WrenAI engine + pf wren api
  - reporting/pages/ask.md, :8766
  - 'Gated road: plan, policy, dry-run, execute, ledger'
- - LLM planning
  - Claude (Anthropic API, claude CLI)
  - pf.agents.base wren_planner
  - Plans only; rules planner fallback
- - Catalogue
  - OpenMetadata
  - :8585 via catalog_sync + mcx_catalog
  - Tables, glossary, tiers, lineage, metrics
- - Orchestration
  - Dagster
  - src/commodity_india/defs/mcx.py
  - Schedules, jobs, sensor, writer pools
- - Provenance
  - pf provenance
  - provenance/ (agent-denied)
  - Five stages, SHA-256 chain, RFC 3161 anchor
- - AI control catalogue
  - FINOS AI Governance Framework
  - policy.yaml controls, air.yaml
  - pf air coverage / pf air gate
- - Static AI scan
  - ASQAV (Atomz-org fork)
  - .asqav.json, ai-governance.yml
  - Repository config declares how audit writes are spelled
- - Agent session layer
  - Claude Code + pf MCP
  - kg_search, kg_neighbors, kg_path, impact_analysis
  - Graph-first navigation per project
- - CI/CD
  - GitHub Actions
  - .github/workflows/*.yml
  - Per-project, governance and findings workflows
