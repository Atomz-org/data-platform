# Vendor provenance registry.
#
# Every upstream this platform borrowed from is a submodule under vendor/, and
# every borrowing is written down here: which upstream file, which of our files,
# and how tightly the two are coupled.
#
# The reason is drift. "Ported from dbt-agent-skills" in a README ages into a
# lie the first time upstream renames a skill, and nobody notices because nothing
# checks. Here, an upstream path that disappears fails `pf vendor verify`, and an
# upstream path whose content changes names the exact files of ours that need
# review — instead of "something in a 16 MB repo moved."
#
# COUPLING KINDS, loosest to tightest:
#
#   shape     We adopted a structure or an idea. No file-level dependency.
#             Upstream drift is informational.
#   port      We reimplemented upstream content for our own runtime. Upstream
#             drift means one of our files should be re-read against it.
#   parity    We check our structure against upstream's required fields. If
#             upstream adds a required concept, we are missing one.
#   schema    Our output is validated against this vendored file at test time.
#             Upstream drift can fail a build — which is the point.
#   data      We read this file at runtime. Upstream drift changes behaviour.
#
# `declined` is not padding. Writing down what we deliberately did not take is
# what stops the next person from "completing the port" and reintroducing an
# assumption this platform is built to avoid.
version: 1

upstreams:
  # ---------------------------------------------------------------- ingest --
  - id: dlthub-ai-workbench
    summary: "toolkit/skill layout, and the annotate-then-generate ingest flow"
    name: dltHub AI Workbench
    url: https://github.com/dlt-hub/dlthub-ai-workbench
    path: vendor/dlthub-ai-workbench
    branch: master
    licence: dltHub License (proprietary)
    licence_review: >
      Scope-of-use is limited to dltHub Services. This platform runs dlt Core on
      Dagster, which reads as a third-party orchestration service under the
      "NOT permitted" examples. Our dlt toolkits are independent rewrites against
      dlt Core's public API for that reason, and the submodule is pinned for
      reference and drift detection rather than redistribution. Confirm with
      counsel before shipping this platform externally.
    role: skills
    why: >
      The workbench established the toolkit/skill layout this platform's
      `platform/toolkits/` follows, and the annotate-then-generate flow that our
      ontology layer is built on.
    adopted:
      - upstream: TOOLKITS.md
        kind: shape
        ours: [platform/toolkits/ROUTING.md]
        note: >
          Toolkit-of-skills packaging. Ours adds a precedence order, because four
          merged skill sets overlap and an agent that picks wrong answers a
          governed metric question with ad-hoc SQL.
      - upstream: workbench/transformations/skills/annotate-sources/SKILL.md
        kind: port
        ours:
          - platform/toolkits/dlt-ingest/skills/annotate-source/SKILL.md
          - platform/src/pf/ontology/annotate.py
        note: >
          Upstream annotates for its own transformation engine. Ours drives
          staging generation, PII policy, monitors, graph edges and conformance —
          the annotation is the contract, not a hint.
      - upstream: workbench/transformations/skills/create-ontology/SKILL.md
        kind: shape
        ours:
          - platform/src/pf/ontology/concepts.yaml
          - platform/src/pf/ontology/model.py
        note: >
          Upstream's ontology is per-pipeline. Ours is three-layered
          (platform / group / project) so sister companies share a vocabulary
          without inheriting each other's invented terms.
      - upstream: workbench/transformations/skills/generate-cdm/SKILL.md
        kind: shape
        ours: [platform/src/pf/runtime/staging.py]
        note: Common-model generation became 1:1 staging with role-driven cleaning.
      - upstream: workbench/sql-database-pipeline/skills/find-source/SKILL.md
        kind: port
        ours: [platform/toolkits/dlt-ingest/skills/find-source/SKILL.md]
      - upstream: workbench/sql-database-pipeline/skills/create-sql-database-pipeline/SKILL.md
        kind: port
        ours: [platform/toolkits/dlt-ingest/skills/create-sql-pipeline/SKILL.md]
      - upstream: workbench/filesystem-pipeline/skills/create-filesystem-pipeline/SKILL.md
        kind: port
        ours: [platform/toolkits/dlt-ingest/skills/create-filesystem-pipeline/SKILL.md]
      - upstream: workbench/data-exploration/skills/explore-data/SKILL.md
        kind: port
        ours: [platform/toolkits/dlt-explore/skills/explore-data/SKILL.md]
      - upstream: workbench/data-quality/skills/setup-data-quality/SKILL.md
        kind: port
        ours: [platform/toolkits/dlt-quality/skills/setup-data-quality/SKILL.md]
      - upstream: workbench/rest-api-pipeline/skills/optimize-rest-api-performance/SKILL.md
        kind: port
        ours: [platform/toolkits/dlt-performance/skills/optimize-performance/SKILL.md]
      - upstream: workbench/quick-start/skills/quick-start/SKILL.md
        kind: port
        ours: [platform/toolkits/platform-init/skills/quick-start/SKILL.md]
      - upstream: workbench/init/skills/setup-secrets/SKILL.md
        kind: shape
        ours: [platform/src/pf/mcp/server.py]
        note: >
          Became `secrets_view_redacted` / `secrets_update_fragment`. An agent can
          write a credential fragment but can never read one back into context.
    declined:
      - what: dltHub Platform deploy skills (one-shot, deploy-run-sample-pipeline)
        why: >
          They target dltHub's hosted runtime. This platform deploys to Dagster,
          and the request was explicitly dlt Core rather than dltHub.
      - what: workbench/init/skills/dlthub-router/SKILL.md
        why: Our router is ROUTING.md plus the knowledge graph, which routes on structure rather than skill name.

