name: 'commodity_rollup'
version: '1.0.0'
config-version: 2
profile: 'commodity_rollup'

model-paths: ["models"]
# Platform cleaning macros load as root-project macros, not as a package:
# `pf_clean` dispatches to its `clean_*` siblings unqualified, and dbt namespaces
# package macros, so a package install fails on the inner dispatch.
#
# dbt-snowflake is the cross-database function layer: `{{ sf_iff(...) }}` and its
# siblings compile to whatever the *target* adapter understands, so one model
# runs on DuckDB in development and Snowflake in production. `pf dialect` lists
# what is covered. Adding a sibling toolkit (dbt-bigquery) means adding its
# macros directory here.
#
# The group's shared macros are on the path for the same reason as the
# platform's: unit factors and minor-currency rules are conformed across every
# commodity sister. The group's shared seeds — the catalog, the market registry,
# units — arrive as a local package (packages.yml): the roll-up describes its
# markets from the same rows the sisters do.
macro-paths:
  - "macros"
  - "../../../../../platform/dbt/macros"
  - "../../../../../platform/toolkits/dbt-snowflake/macros"
  - "../../../shared/transform/macros"
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: "target"

models:
  commodity_rollup:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  commodity_shared:
    +schema: reference
