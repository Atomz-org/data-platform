#:schema https://developers.openai.com/codex/config-schema.json
# GENERATED by `pf context refresh` from .mcp.json — do not hand-edit.
# The gate runs from .codex/hooks.json (PreToolUse on Bash and apply_patch);
# a person approves what .codex/rules/pf.rules marks `prompt`. Codex loads
# both only for a trusted project. See docs/HARNESSES.md.

approval_policy = "on-request"
sandbox_mode = "workspace-write"

persistent_instructions = "Follow AGENTS.md. Section 0 names your scope (Session). Ask the graph before reading files (kg_search, impact_analysis). A hook refusal is a finding: report it, never re-route it. Never pass --no-verify."

[mcp_servers.code-review-graph]
command = "uvx"
args = ["code-review-graph@2.3.9", "serve", "--repo", "platform"]
startup_timeout_sec = 30

[mcp_servers.graphify]
command = "uvx"
args = ["--from", "graphifyy", "graphify-mcp", "graphify-out/graph.json"]
startup_timeout_sec = 30

[mcp_servers.pf]
command = "uv"
args = ["run", "pf", "mcp"]
env = { PF_PROJECT_DIR = "." }
startup_timeout_sec = 30
