# GENERATED by `pf bootstrap`. Do not edit.
#
# Every check below is derived, not written:
#
#   contracts/annotations.yaml   column -> ontology role
#   ontology concepts.yaml       role   -> review intent, pii flag
#   pf.tools.recce               intent -> check type
#
# So the way to change a check is to fix what the column *means*, not
# to edit here: a wrong check is a wrong role. Columns whose role is
# PII are excluded from every value-level check, because this file's
# results land in recce_state.json, which is durable and shared.
#
# Regenerate with `pf tool recce config <group> <project>`.
checks:
- name: Row count diff
  description: Row counts for every modified table model.
  type: row_count_diff
  params:
    select: state:modified,config.materialized:table
- name: Schema diff
  description: Column additions, removals and type changes.
  type: schema_diff
- name: "Value diff \u2014 dim_commodities"
  description: Row-level differences in dim_commodities (one commodity), keyed on
    commodity_id.
  type: value_diff
  params:
    model: dim_commodities
    primary_key: commodity_id
- name: "Category drift \u2014 dim_commodities.category"
  description: Values gained or lost in category (one commodity). A category that
    appears or disappears breaks an accepted_values test downstream without moving
    the row count.
  type: query_diff
  params:
    sql_template: select category as category, count(*) as n from {{ ref('dim_commodities')
      }} group by 1 order by 1
    primary_keys:
    - category
