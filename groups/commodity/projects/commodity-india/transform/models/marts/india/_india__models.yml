version: 2
# India's own marts: what an MCX contract or a retail purity grade makes of the
# conformed landed price. Nothing here is expected in another sister.

models:
  - name: fct_precious_metal_retail_prices_daily
    description: Landed gold and silver in Indian retail conventions — per gram, 10 g and kg, by purity.
    access: public
    meta: {grain: one precious metal per purity grade per price date}
    columns:
      - name: retail_price_id
        meta: {role: natural_key}
        data_tests: [unique, not_null]
      - name: commodity_id
        meta: {role: foreign_key, links_to: Commodity}
      - name: price_date
        meta: {role: event_time}
      - name: purity_code
        meta: {role: status_enum}
      - name: price_inr_per_gram
        meta: {role: unit_price}
        data_tests: [not_null]
      - name: price_inr_per_10g
        meta: {role: unit_price}
      - name: price_inr_per_kg
        meta: {role: unit_price}

  - name: fct_mcx_lot_equivalents_daily
    description: >
      The landed price of each MCX bullion and base-metal contract, per its quote
      basis and per lot — GOLDM per 10 g, ALUMINI and ZINCMINI per kg and per
      1 MT lot. Computed from international benchmarks — not an MCX quote.
    access: public
    meta: {grain: one MCX contract per price date}
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [contract_code, price_date]
    columns:
      - name: lot_equivalent_id
        meta: {role: natural_key}
        data_tests: [unique, not_null]
      - name: contract_code
        description: MCX trading symbol.
        meta: {role: status_enum}
        data_tests: [not_null]
      - name: commodity_id
        meta: {role: foreign_key, links_to: Commodity}
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_commodities')
                field: commodity_id
      - name: price_date
        meta: {role: event_time}
      - name: price_basis
        description: futures, or indicative when the underlying has no live feed (zinc).
        meta: {role: status_enum}
      - name: quote_unit
        meta: {role: unit_of_measure}
      - name: quote_equivalent_inr
        description: Landed ₹ for one MCX quote basis (quote_size × quote_unit).
        meta: {role: unit_price}
        data_tests: [not_null]
      - name: lot_value_inr
        description: Landed ₹ for one full lot (lot_size × lot_unit).
        meta: {role: unit_price}
        data_tests: [not_null]

  - name: rpt_mcx_contract_board
    description: >
      One row per tracked MCX contract: the latest landed equivalent per quote
      basis and per lot, and how old its benchmark is. ZINC and ZINCMINI carry the
      last indicative LME level and read stale until it is refreshed.
    access: public
    meta: {grain: one MCX contract}
    columns:
      - name: contract_code
        meta: {role: natural_key}
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('mcx_contract_lots')
                field: contract_code
      - name: commodity_id
        meta: {role: foreign_key, links_to: Commodity}
      - name: quote_equivalent_inr
        meta: {role: unit_price}
        data_tests: [not_null]
      - name: lot_value_inr
        meta: {role: unit_price}
      - name: is_stale
        description: The underlying benchmark is more than four days old.

unit_tests:
  - name: retail_prices_apply_purity_and_unit_conventions
    description: 22K is 22/24 of the landed fine-metal price; per kg comes from the units seed.
    model: fct_precious_metal_retail_prices_daily
    given:
      - input: ref('fct_landed_prices_daily')
        rows:
          - {commodity_id: gold, price_date: 2026-09-16, price_basis: futures, market_unit: g, landed_price_local: 15292.9672, is_duty_rate_confirmed: true}
      - input: ref('precious_metal_purities')
        rows:
          - {commodity_id: gold, purity_code: 24k, purity_label: 24K, fineness: 1.0}
          - {commodity_id: gold, purity_code: 22k, purity_label: 22K, fineness: 0.9166666667}
      - input: ref('units_of_measure')
        rows:
          - {unit_code: g, base_units_per_unit: 0.001}
          - {unit_code: kg, base_units_per_unit: 1}
    expect:
      rows:
        - {purity_code: 24k, price_inr_per_gram: 15292.9672, price_inr_per_10g: 152929.6720, price_inr_per_kg: 15292967.2000}
        - {purity_code: 22k, price_inr_per_gram: 14018.5533, price_inr_per_10g: 140185.5327, price_inr_per_kg: 14018553.2672}

  - name: mcx_equivalents_follow_quote_basis_and_lot
    description: >
      ALUMINI is quoted per kg and traded in 1 MT lots, so ₹353.7931/kg is a
      ₹3,53,793.10 lot and the 5 MT ALUMINIUM lot is five times that. GOLDM is
      quoted per 10 g. Zinc lands from an indicative level and says so.
    model: fct_mcx_lot_equivalents_daily
    given:
      - input: ref('fct_landed_prices_daily')
        rows:
          - {commodity_id: gold, price_date: 2026-09-16, price_basis: futures, market_unit: g, landed_price_local: 15292.9672, is_duty_rate_confirmed: true}
          - {commodity_id: aluminium, price_date: 2026-09-16, price_basis: futures, market_unit: kg, landed_price_local: 353.7931, is_duty_rate_confirmed: true}
          - {commodity_id: zinc, price_date: 2026-06-12, price_basis: indicative, market_unit: kg, landed_price_local: 353.5942, is_duty_rate_confirmed: true}
      - input: ref('mcx_contract_lots')
        rows:
          - {contract_code: GOLDM, commodity_id: gold, contract_name: Gold Mini, lot_size: 100, lot_unit: g, quote_size: 10, quote_unit: g}
          - {contract_code: ALUMINIUM, commodity_id: aluminium, contract_name: Aluminium, lot_size: 5, lot_unit: metric_ton, quote_size: 1, quote_unit: kg}
          - {contract_code: ALUMINI, commodity_id: aluminium, contract_name: Aluminium Mini, lot_size: 1, lot_unit: metric_ton, quote_size: 1, quote_unit: kg}
          - {contract_code: ZINCMINI, commodity_id: zinc, contract_name: Zinc Mini, lot_size: 1, lot_unit: metric_ton, quote_size: 1, quote_unit: kg}
      - input: ref('units_of_measure')
        rows:
          - {unit_code: g, base_units_per_unit: 0.001}
          - {unit_code: kg, base_units_per_unit: 1}
          - {unit_code: metric_ton, base_units_per_unit: 1000}
    expect:
      rows:
        - {contract_code: GOLDM, price_basis: futures, quote_equivalent_inr: 152929.6720, lot_value_inr: 1529296.72}
        - {contract_code: ALUMINIUM, price_basis: futures, quote_equivalent_inr: 353.7931, lot_value_inr: 1768965.50}
        - {contract_code: ALUMINI, price_basis: futures, quote_equivalent_inr: 353.7931, lot_value_inr: 353793.10}
        - {contract_code: ZINCMINI, price_basis: indicative, quote_equivalent_inr: 353.5942, lot_value_inr: 353594.20}

exposures:
  - name: commodity_price_board
    label: Commodity Price Board
    type: dashboard
    maturity: medium
    description: >
      Live board of international benchmarks and India import landed prices across
      33 commodities, modelled on MrChartist/commodity-price-tracker.
    depends_on:
      - ref('rpt_commodity_price_board')
      - ref('fct_commodity_prices_daily')
      - ref('fct_precious_metal_retail_prices_daily')
      - ref('fct_mcx_lot_equivalents_daily')
      - ref('rpt_mcx_contract_board')
      - ref('fct_fx_rates_daily')
    owner: {name: Commodity Research, email: research@commodity.example}
