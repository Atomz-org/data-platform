  # ----------------------------------------------------------------- loops --
  - id: loop-engineering
    summary: "loop governance: state, gate, budget, circuit breaker, autonomy ladder"
    name: Loop Engineering
    url: https://github.com/cobusgreyling/loop-engineering
    path: vendor/loop-engineering
    branch: main
    licence: MIT
    role: shape
    why: >
      The governance shape for scheduled agent work: durable state, a path gate,
      a token budget, a circuit breaker and an autonomy ladder. The patterns are
      software-delivery loops; the subjects here are data-platform ones.
    adopted:
      - upstream: LOOP.md
        kind: shape
        ours: [LOOP.md]
      - upstream: STATE.md
        kind: shape
        ours: [STATE.md]
        note: Generated here, never hand-edited — a hand-edited state file stops being evidence.
      - upstream: gate.yaml
        kind: shape
        ours: [gate.yaml, gate.capabilities.yaml, platform/hooks/pre_tool_use.py]
        note: >
          Upstream's gate is advisory. Ours is a PreToolUse hook, so the denylist
          is structural rather than a rule an agent has to remember.
      - upstream: loop-budget.md
        kind: shape
        ours: [loop-budget.md, platform/src/pf/loops/runner.py]
      - upstream: loop-constraints.md
        kind: shape
        ours: [loop-constraints.md]
      - upstream: patterns/registry.yaml
        kind: shape
        ours: [platform/src/pf/loops/registry.py]
        note: Same fields — autonomy level, cadence, token budget, human gates.
      - upstream: patterns/registry.schema.json
        kind: parity
        ours: [platform/src/pf/loops/registry.py]
        note: >
          Field parity, not instance validation. Our loops cannot satisfy the
          schema literally: `cadence` is a time grammar (`^[0-9]+[mhd]...`) and
          four of ours are event-driven (pre-commit, on manifest change, on dbt
          failure), while `file` requires a per-pattern markdown page where ours
          are one LOOP.md. So `pf vendor verify` asserts the weaker, honest
          property — every field upstream marks required has a counterpart in
          LoopSpec. If upstream adds a required governance concept, we are
          missing it, and that is the signal worth having.
      - upstream: docs/safety.md
        kind: shape
        ours: [platform/src/pf/loops/runner.py]
        note: Circuit breaker — the same failure twice stops the loop rather than retrying it.
      - upstream: skills/loop-verifier/SKILL.md
        kind: shape
        ours: [platform/src/pf/loops/audit.py]
      - upstream: patterns/dependency-sweeper.md
        kind: shape
        ours: [platform/src/pf/loops/registry.py, platform/src/pf/vendor/model.py]
        note: >
          The direct ancestor of the `vendor-drift` loop: report upstream movement,
          never apply it. L1 by construction — a submodule bump is a human decision.
      - upstream: patterns/pr-babysitter.md
        kind: shape
        ours: [.github/workflows/pr-report.yml, platform/src/pf/pr.py]
        note: >
          Ours reports rather than fixes. The PR comment carries blast radius,
          vendor drift and readiness; a human still merges.
    declined:
      - what: npx @cobusgreyling/loop-context tooling
        why: >
          The ledger, budget and circuit breaker are implemented in `pf` so they
          share the tracking DB with agent spend and impact history. One Node
          dependency in the critical path of every loop is not worth it.
      - what: patterns/issue-triage.md, patterns/ci-sweeper.md
        why: Software-delivery subjects. Our loops watch freshness, drift, metric coverage and PII.

