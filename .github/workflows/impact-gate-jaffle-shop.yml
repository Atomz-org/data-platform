# GENERATED by `pf new-project --with github`. The merge gate, in CI.
#
# This runs the same `pf impact-gate` a developer's pre-commit hook runs, so a
# change that bypasses the local hook (--no-verify, a web edit, a bot commit)
# still cannot merge without its blast radius being reported.
name: impact-gate (jaffle-shop)

on:
  pull_request:
    paths:
      - "groups/jaffle/projects/jaffle-shop/transform/models/**"
      - "groups/jaffle/projects/jaffle-shop/src/*/sources/**"

jobs:
  impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # impact needs the merge base, not a shallow clone
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      # The graph is a build artefact, not a commit: rebuild before gating or the
      # gate reports the blast radius of whatever the last committer had locally.
      - run: uv run pf kg build jaffle jaffle-shop
      - name: Blast radius of changed models
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            -- 'groups/jaffle/projects/jaffle-shop/transform/models/**/*.sql' \
            | xargs -r -n1 basename | sed 's/\.sql$//' | sed 's/^/model:/' | paste -sd, -)
          [ -z "$CHANGED" ] && echo "no model changes" && exit 0
          uv run pf impact-gate jaffle jaffle-shop "$CHANGED"
