version: 2

sources:
  - name: ecom
    # The raw layer is *ingested*, not built by dbt: dlt loads it once, into
    # main_raw. Deriving the schema from target.schema made every non-default
    # target look for a raw layer that was never created — `--target base`,
    # which recce uses to capture its comparison build, resolved to base_raw
    # and failed all 58 sources. Only dbt-built models carry the target prefix.
    schema: "{{ var('raw_schema', 'main_raw') }}"
    description: E-commerce data for the Jaffle Shop
    tables:
      - name: raw_customers
        description: One record per person who has purchased one or more items
      - name: raw_orders
        description: One record per order (consisting of one or more order items)
        loaded_at_field: ordered_at
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}
      - name: raw_items
        description: Items included in an order
      - name: raw_stores
        loaded_at_field: opened_at
        freshness:
          warn_after: {count: 72, period: hour}
          error_after: {count: 168, period: hour}
      - name: raw_products
        description: One record per SKU for items sold in stores
      - name: raw_supplies
        description: One record per supply per SKU of items sold in stores
