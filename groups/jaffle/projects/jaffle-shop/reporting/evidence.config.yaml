# Generated by `pf report build`. Palette values are validated —
# adjacent-pair CVD deltaE >= 8, normal-vision >= 15, contrast checked on both
# surfaces. Re-picking them by eye makes charts unreadable for ~8% of readers.
title: jaffle-shop

plugins:
  datasources:
    "@evidence-dev/duckdb": {}

theme:
  colors:
    categorical:
    light:
      - '#2a78d6'
      - '#eb6834'
      - '#1baf7a'
      - '#eda100'
      - '#e87ba4'
      - '#008300'
      - '#4a3aa7'
      - '#e34948'
    dark:
      - '#3987e5'
      - '#d95926'
      - '#199e70'
      - '#c98500'
      - '#d55181'
      - '#008300'
      - '#9085e9'
      - '#e66767'

  status:
    good: '#0ca30c'
    warning: '#fab219'
    serious: '#ec835a'
    critical: '#d03b3b'
