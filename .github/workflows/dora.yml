# DORA (Regulation (EU) 2022/2554) evidence for every entity, on a schedule and
# on the changes that can move it.
#
# Two jobs, because the two kinds of evidence come from different places and
# fail for different reasons:
#
#   supply-chain    RTS (EU) 2024/1774 Art. 10. The dependency tree of this
#                   checkout, as a CycloneDX SBOM, scanned by Trivy and judged
#                   by each entity's patch policy (`dora.sbom` in its resolved
#                   aidf.yaml — zero tolerance on fixable Critical/High by
#                   default, exceptions dated and owned). Runs on every pull
#                   request that changes the lockfile, so a vulnerable pin
#                   cannot merge, and nightly, so a CVE published against a pin
#                   already on `main` turns the run red the next morning.
#
#   infrastructure  Articles 8-11. Prowler over the cloud account an entity
#                   declares (`dora.provider`), findings mapped to articles by
#                   the statutory matrix (`pf dora matrix`). Nightly and on
#                   demand only — it needs cloud credentials a pull request
#                   from a fork must never see — and skipped with a warning
#                   when no provider is configured, because "no scan ran" must
#                   never read as "no findings".
#
# Both end in `pf dora audit`, which writes each entity's evidence matrix
# (`governance/dora/matrix.md`), records the audit to a provenance chain with
# the matrix's SHA-256, and exits non-zero on a failing article. The matrices,
# the scans and the chain are archived as one run artifact: an auditor gets the
# report, the inputs it was judged from, and the hash that ties them together.
#
# Prowler and Trivy are commands, installed isolated — never workspace
# dependencies. `pyproject.toml` says why for the other tools of that shape.
name: DORA compliance

on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC, daily
  workflow_dispatch:
    inputs:
      provider:
        description: "Override the provider for every entity (aws | azure | gcp | kubernetes); empty uses each aidf.yaml"
        type: string
        default: ""
      live:
        description: "Also read repository settings (branch protection) through the GitHub API"
        type: boolean
        default: true
  pull_request:
    paths:
      - "uv.lock"
      - "pyproject.toml"
      - "platform/pyproject.toml"
      - "groups/*/projects/*/pyproject.toml"
      - "platform/src/pf/aidf/**"
      - "**/governance/aidf.yaml"
      - "groups/*/aidf.yaml"
      - ".github/workflows/dora.yml"

permissions:
  contents: read

concurrency:
  group: dora-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TRIVY_VERSION: ${{ vars.DORA_TRIVY_VERSION || 'v0.65.0' }}
  PROWLER_VERSION: ${{ vars.DORA_PROWLER_VERSION || '5.10.0' }}

jobs:
  supply-chain:
    name: Supply chain (RTS Art. 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync

      - name: Trivy
        uses: aquasecurity/setup-trivy@v0.2.3
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true

      # The bill of materials first, then the scan *of the bill*, so what was
      # judged is exactly what is archived. Every severity is collected; which
      # ones block is the entity's policy, applied by `pf dora audit`, not a
      # scanner flag — a flag cannot carry a dated exception or a grace window.
      - name: SBOM and vulnerability scan
        run: |
          mkdir -p .tmp/dora
          trivy fs --format cyclonedx --output .tmp/dora/sbom.cdx.json --quiet .
          trivy sbom --format json --severity CRITICAL,HIGH,MEDIUM,LOW \
                --output .tmp/dora/vulnerabilities.json --quiet .tmp/dora/sbom.cdx.json
          python3 - <<'PY'
          import json
          doc = json.load(open(".tmp/dora/vulnerabilities.json"))
          n = sum(len(r.get("Vulnerabilities") or []) for r in doc.get("Results") or [])
          comps = len(json.load(open(".tmp/dora/sbom.cdx.json")).get("components") or [])
          print(f"{comps} components in the SBOM, {n} vulnerabilities at any severity")
          PY

      # One audit per entity: the same scan, each entity's own patch policy,
      # exceptions and article scope. Non-zero when any entity's window is
      # breached, which is what blocks a pull request here.
      - name: Judge against every entity's patch policy
        id: audit
        run: |
          set +e
          uv run pf dora audit --vulns .tmp/dora/vulnerabilities.json --sbom .tmp/dora/sbom.cdx.json \
                --no-run ${{ inputs.live == true && '--live' || '' }} | tee .tmp/dora/audit.log
          code=${PIPESTATUS[0]}
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Step summary
        if: always()
        run: |
          {
            echo "## DORA supply-chain evidence"
            echo
            echo "Exit \`${{ steps.audit.outputs.exit }}\` — 0 is clean or gaps-only, 1 is a breached article."
            echo
            for m in groups/*/projects/*/governance/dora/matrix.md; do
              [ -f "$m" ] || continue
              echo "<details><summary>$(echo "$m" | cut -d/ -f2,4)</summary>"
              echo
              cat "$m"
              echo
              echo "</details>"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Archive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dora-supply-chain-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 400
          path: |
            .tmp/dora/
            groups/*/projects/*/governance/dora/
            provenance/chain.jsonl

  infrastructure:
    name: Infrastructure (Art. 8-11) and GitHub posture (RTS Art. 16)
    # Never on a pull request — this job holds credentials, and a pull request
    # from a fork must never see them. Nightly and on demand.
    #
    # The scans are independent of each other on purpose. A missing GCP secret
    # must not cost the GitHub evidence, so no credential or scan step is
    # allowed to abort the job: each records its outcome, the audit judges
    # whatever produced output, the evidence is archived — and only then, as
    # the last step, does the job fail if a scan that *was* configured did not
    # run. Nothing configured is a warning; configured and broken is red.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC for the cloud role or workload identity; no long-lived key needed
    env:
      PROVIDER: ${{ inputs.provider || vars.DORA_PROWLER_PROVIDER }}
      # Secrets are not readable in `if:`; mapped to env so the steps can test presence.
      GCP_WIF_PROVIDER: ${{ secrets.DORA_GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.DORA_GCP_SERVICE_ACCOUNT }}
      GCP_CREDENTIALS_JSON: ${{ secrets.DORA_GCP_CREDENTIALS_JSON }}
      GCP_PROJECT_IDS: ${{ vars.DORA_GCP_PROJECT_IDS }}
      GITHUB_PERSONAL_ACCESS_TOKEN: ${{ secrets.DORA_GITHUB_TOKEN }}
      GITHUB_SCAN_ORG: ${{ vars.DORA_GITHUB_ORGANIZATION || github.repository_owner }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync

      # Isolated, pinned, never in the workspace lockfile. Prowler pins boto3,
      # azure and google SDK ranges that would fight dlt and dagster over one
      # resolution, exactly as openmetadata-ingestion did. The version tracks
      # the submodule pin at vendor/prowler.
      - name: Prowler
        run: uv tool install "prowler==${PROWLER_VERSION}"

      # ---- cloud credentials, one block per provider, none of them fatal ------
      - name: AWS credentials (OIDC)
        id: aws
        if: env.PROVIDER == 'aws'
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DORA_AWS_ROLE_ARN }}
          aws-region: ${{ vars.DORA_AWS_REGION || 'eu-west-1' }}

      # Workload identity federation first — keyless, the recommended shape —
      # and a service-account key only when no federation is configured.
      - name: GCP credentials (workload identity)
        id: gcp_wif
        if: env.PROVIDER == 'gcp' && env.GCP_WIF_PROVIDER != ''
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: GCP credentials (service-account key)
        id: gcp_key
        if: env.PROVIDER == 'gcp' && env.GCP_WIF_PROVIDER == '' && env.GCP_CREDENTIALS_JSON != ''
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_CREDENTIALS_JSON }}

      - name: Kubernetes credentials
        id: k8s
        if: env.PROVIDER == 'kubernetes'
        continue-on-error: true
        env:
          KUBECONFIG_B64: ${{ secrets.DORA_KUBECONFIG_B64 }}
        run: |
          if [ -z "$KUBECONFIG_B64" ]; then echo "DORA_KUBECONFIG_B64 is not set"; exit 1; fi
          mkdir -p "$HOME/.kube" && echo "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config" && chmod 600 "$HOME/.kube/config"

      # Azure authenticates through `azure/login`; add the step here, with
      # `id: azure` and `continue-on-error: true`, when an entity declares it.

      # One place decides whether the cloud scan may run, and says why not.
      - name: Cloud credentials ready?
        id: cloud
        if: always()
        run: |
          ready=false; why=""
          case "$PROVIDER" in
            "")         why="no DORA_PROWLER_PROVIDER set" ;;
            aws)        [ "${{ steps.aws.outcome }}" = "success" ] && ready=true || why="OIDC role assumption failed or DORA_AWS_ROLE_ARN unset" ;;
            gcp)        if [ "${{ steps.gcp_wif.outcome }}" = "success" ] || [ "${{ steps.gcp_key.outcome }}" = "success" ]; then ready=true
                        elif [ -z "$GCP_WIF_PROVIDER" ] && [ -z "$GCP_CREDENTIALS_JSON" ]; then why="neither DORA_GCP_WORKLOAD_IDENTITY_PROVIDER + DORA_GCP_SERVICE_ACCOUNT nor DORA_GCP_CREDENTIALS_JSON is set"
                        else why="GCP authentication failed (see the credentials step)"; fi ;;
            kubernetes) [ "${{ steps.k8s.outcome }}" = "success" ] && ready=true || why="kubeconfig missing or unreadable" ;;
            azure)      why="no azure/login step is wired yet" ;;
            *)          why="unknown provider '$PROVIDER'" ;;
          esac
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "why=$why" >> "$GITHUB_OUTPUT"
          if [ -n "$PROVIDER" ] && [ "$ready" != true ]; then
            echo "::warning title=Cloud scan skipped::$PROVIDER — $why. Articles 8-11 read 'unverified' for this run. See docs/AIDF.md, 'Configuring the scans'."
          fi

      # ---- the cloud scan -----------------------------------------------------
      # Exit 3 means "findings failed", which is the normal outcome of a scan
      # worth running; the audit below decides what that means per article and
      # per entity. The DORA framework is requested when this Prowler lists it,
      # so every finding is stamped with the DORA-Art ids it evidences.
      - name: Prowler — cloud
        id: cloud_scan
        if: always() && steps.cloud.outputs.ready == 'true'
        continue-on-error: true
        run: |
          mkdir -p .tmp/dora
          fw="dora_2022_2554"
          extra=""
          if [ "$PROVIDER" = "gcp" ] && [ -n "$GCP_PROJECT_IDS" ]; then extra="--project-id $GCP_PROJECT_IDS"; fi
          if prowler "$PROVIDER" --list-compliance 2>/dev/null | grep -q "$fw"; then
            prowler "$PROVIDER" --compliance "$fw" -M json-ocsf -o .tmp/dora -F "prowler_${PROVIDER}" --ignore-exit-code-3 $extra
          else
            echo "::notice::Prowler ${PROWLER_VERSION} lists no '$fw' framework for $PROVIDER; running the full check set and mapping by check id"
            prowler "$PROVIDER" -M json-ocsf -o .tmp/dora -F "prowler_${PROVIDER}" --ignore-exit-code-3 $extra
          fi

      # ---- the GitHub scan, independent of everything above ------------------
      # The organisation and its repositories: branch protection, required
      # reviews, signed commits, MFA, Actions permissions. Read with a
      # fine-grained PAT (organisation members and administration: read;
      # repository administration, metadata and Actions: read) in
      # DORA_GITHUB_TOKEN — never the run's GITHUB_TOKEN, which cannot see
      # organisation settings.
      - name: Prowler — GitHub
        id: github_scan
        if: always() && env.GITHUB_PERSONAL_ACCESS_TOKEN != ''
        continue-on-error: true
        run: |
          mkdir -p .tmp/dora
          prowler github --organization "$GITHUB_SCAN_ORG" -M json-ocsf -o .tmp/dora -F prowler_github --ignore-exit-code-3

      # ---- judge whatever ran -------------------------------------------------
      # One audit per entity over every scan that produced output, so a gcp
      # finding and a github finding land on their articles side by side in one
      # matrix. A scan that did not run leaves its articles `unverified`.
      - name: Judge against every entity's article scope
        id: audit
        if: always()
        run: |
          set +e
          args=""
          for f in .tmp/dora/prowler_*.ocsf.json; do [ -f "$f" ] && args="$args --ocsf $f"; done
          if [ -z "$args" ]; then
            echo "no scan produced output; the audit runs on repository and ledger evidence alone"
            uv run pf dora audit --no-run --live | tee .tmp/dora/audit.log
          else
            uv run pf dora audit $args ${PROVIDER:+--provider "$PROVIDER"} --no-run --live | tee .tmp/dora/audit.log
          fi
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Step summary
        if: always()
        run: |
          mark() { case "$1" in success) echo "ran";; failure) echo "**FAILED**";; skipped|"") echo "skipped";; *) echo "$1";; esac; }
          {
            echo "## DORA infrastructure evidence"
            echo
            echo "| scan | outcome |"
            echo "|---|---|"
            echo "| cloud (${PROVIDER:-none}) | $(mark '${{ steps.cloud_scan.outcome }}')${{ steps.cloud.outputs.why && format(' — {0}', steps.cloud.outputs.why) || '' }} |"
            echo "| github (${GITHUB_SCAN_ORG}) | $([ -n "$GITHUB_PERSONAL_ACCESS_TOKEN" ] && mark '${{ steps.github_scan.outcome }}' || echo 'skipped — no DORA_GITHUB_TOKEN') |"
            echo "| audit | exit \`${{ steps.audit.outputs.exit }}\` (0 clean or gaps only, 1 a breached article) |"
            echo
            for m in groups/*/projects/*/governance/dora/matrix.md; do
              [ -f "$m" ] || continue
              echo "<details><summary>$(echo "$m" | cut -d/ -f2,4)</summary>"
              echo
              cat "$m"
              echo
              echo "</details>"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Archive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dora-infrastructure-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 400
          path: |
            .tmp/dora/
            groups/*/projects/*/governance/dora/
            provenance/chain.jsonl

      # Last, so the evidence above is always produced and archived first:
      # red when a scan that was configured did not run, or an entity breached
      # an article; a warning, not a failure, when nothing was configured.
      - name: Outcome
        if: always()
        run: |
          failed=""
          if [ -n "$PROVIDER" ] && [ "${{ steps.cloud_scan.outcome }}" != "success" ]; then failed="$failed cloud($PROVIDER)"; fi
          if [ -n "$GITHUB_PERSONAL_ACCESS_TOKEN" ] && [ "${{ steps.github_scan.outcome }}" != "success" ]; then failed="$failed github"; fi
          if [ -z "$PROVIDER" ] && [ -z "$GITHUB_PERSONAL_ACCESS_TOKEN" ]; then
            echo "::warning title=DORA infrastructure scan not configured::Set DORA_PROWLER_PROVIDER (aws | azure | gcp | kubernetes) with its credential secret, and/or DORA_GITHUB_TOKEN for the GitHub posture scan. Articles 8-11 and RTS Art. 16 read 'unverified' until then — never 'pass'."
          fi
          if [ -n "$failed" ]; then echo "::error title=Configured scan did not run::$failed"; fi
          [ -z "$failed" ] && [ "${{ steps.audit.outputs.exit }}" = "0" ]
