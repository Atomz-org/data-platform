[project]
name = "commodity-shared"
version = "0.1.0"
description = "commodity group: conformed catalog loaders and the market-data connectors every sister uses"
requires-python = ">=3.11,<3.13"
dependencies = ["pf"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commodity_shared"]
