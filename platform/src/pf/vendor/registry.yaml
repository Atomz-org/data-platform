  # ----------------------------------------------------------------- loops --
  - id: loop-engineering
    summary: "loop governance: state, gate, budget, circuit breaker, autonomy ladder"
    name: Loop Engineering
    url: https://github.com/cobusgreyling/loop-engineering
    path: vendor/loop-engineering
    branch: main
    licence: MIT
    role: shape
    why: >
      The governance shape for scheduled agent work: durable state, a path gate,
      a token budget, a circuit breaker and an autonomy ladder. The patterns are
      software-delivery loops; the subjects here are data-platform ones.
    adopted:
      - upstream: LOOP.md
        kind: shape
        ours: [LOOP.md]
      - upstream: STATE.md
        kind: shape
        ours: [STATE.md]
        note: Generated here, never hand-edited — a hand-edited state file stops being evidence.
      - upstream: gate.yaml
        kind: shape
        ours: [gate.yaml, gate.capabilities.yaml, platform/hooks/pre_tool_use.py]
        note: >
          Upstream's gate is advisory. Ours is a PreToolUse hook, so the denylist
          is structural rather than a rule an agent has to remember.
      - upstream: loop-budget.md
        kind: shape
        ours: [loop-budget.md, platform/src/pf/loops/runner.py]
      - upstream: loop-constraints.md
        kind: shape
        ours: [loop-constraints.md]
      - upstream: patterns/registry.yaml
        kind: shape
        ours: [platform/src/pf/loops/registry.py]
        note: Same fields — autonomy level, cadence, token budget, human gates.
      - upstream: patterns/registry.schema.json
        kind: parity
        ours: [platform/src/pf/loops/registry.py]
        note: >
          Field parity, not instance validation. Our loops cannot satisfy the
          schema literally: `cadence` is a time grammar (`^[0-9]+[mhd]...`) and
          four of ours are event-driven (pre-commit, on manifest change, on dbt
          failure), while `file` requires a per-pattern markdown page where ours
          are one LOOP.md. So `pf vendor verify` asserts the weaker, honest
          property — every field upstream marks required has a counterpart in
          LoopSpec. If upstream adds a required governance concept, we are
          missing it, and that is the signal worth having.
      - upstream: docs/safety.md
        kind: shape
        ours: [platform/src/pf/loops/runner.py]
        note: Circuit breaker — the same failure twice stops the loop rather than retrying it.
      - upstream: skills/loop-verifier/SKILL.md
        kind: shape
        ours: [platform/src/pf/loops/audit.py]
      - upstream: patterns/dependency-sweeper.md
        kind: shape
        ours: [platform/src/pf/loops/registry.py, platform/src/pf/vendor/model.py]
        note: >
          The direct ancestor of the `vendor-drift` loop: report upstream movement,
          never apply it. L1 by construction — a submodule bump is a human decision.
      - upstream: patterns/pr-babysitter.md
        kind: shape
        ours: [.github/workflows/pr-report.yml, platform/src/pf/pr.py]
        note: >
          Ours reports rather than fixes. The PR comment carries blast radius,
          vendor drift and readiness; a human still merges.
    declined:
      - what: npx @cobusgreyling/loop-context tooling
        why: >
          The ledger, budget and circuit breaker are implemented in `pf` so they
          share the tracking DB with agent spend and impact history. One Node
          dependency in the critical path of every loop is not worth it.
      - what: patterns/issue-triage.md, patterns/ci-sweeper.md
        why: Software-delivery subjects. Our loops watch freshness, drift, metric coverage and PII.

  # -------------------------------------------------------------- evidence --
  - id: evidence-bi
    summary: "BI as a projection of the semantic layer, not a second place metrics live"
    name: Evidence BI (dbt semantic layer edition)
    url: https://github.com/Atomz-org/Evidence-BI
    path: vendor/evidence-bi
    branch: main
    licence: not stated upstream
    licence_review: >
      No LICENSE file at the upstream root as of the pinned commit. Treated as
      reference only: our reporting layer is generated from our own semantic
      layer, and no upstream file is copied into a project.
    role: reference
    why: >
      Governed metrics plus designed dashboards — BI as a projection of the
      semantic layer rather than a place where metrics get redefined.
    adopted:
      - upstream: evidence.config.yaml
        kind: shape
        ours: [platform/src/pf/projections/evidence.py]
      - upstream: components
        kind: shape
        ours: [platform/src/pf/projections/evidence.py]
        note: >
          Chart and layout conventions. The CVD-safe palette and the dual-axis
          prohibition are enforced mechanically in report_audit.py.
      - upstream: queries
        kind: shape
        ours: [platform/src/pf/projections/evidence.py]
        note: >
          Every query is compiled from a metric definition. A hand-written query
          in a page is a second definition, and the audit flags it.
      - upstream: docs
        kind: shape
        ours: [platform/toolkits/evidence-bi/skills/build-dashboard/SKILL.md]
    declined:
      - what: cube/, rill/, canvas/ connectors
        why: One semantic layer (MetricFlow) and one MDL projection. A second connector is a second definition of revenue.
      - what: deploy/
        why: Deployment is out of scope for the platform; `pf report dev` is local.

  # -------------------------------------------------------------- ontology --
  - id: ontology-playground
    summary: "what a business ontology actually looks like, and RDF/XML fidelity"
    name: Microsoft Ontology Playground
    url: https://github.com/microsoft/Ontology-Playground
    path: vendor/ontology-playground
    branch: main
    licence: MIT
    role: reference
    why: >
      A working reference for how a business ontology is actually shaped —
      classes with identity, datatype properties, and object properties with
      domain/range — plus round-tripping through RDF/XML.
    adopted:
      - upstream: catalogue/official
        kind: shape
        ours:
          - platform/src/pf/ontology/concepts.yaml
          - platform/src/pf/ontology/topology.yaml
        note: >
          Their ecommerce and finance catalogue entries model the same
          Customer/Order/Payment core. Ours matched against them rather than
          inventing a vocabulary.
      - upstream: docs
        kind: shape
        ours: [platform/src/pf/projections/owl.py]
        note: >
          RDF/XML fidelity — cardinality projected as FunctionalProperty /
          InverseFunctionalProperty so an external OWL tool reads what we meant.
    declined:
      - what: The React/Vite playground application (src/, api/)
        why: It is an editor. Our ontology is edited as YAML in the repo and reviewed as a diff.
      - what: api/generate-ontology
        why: >
          We induce from what actually landed in the warehouse (`pf semantic scan`)
          rather than from a prompt, so every axiom carries observed evidence.

  # -------------------------------------------------------------- topology --
  - id: opentopology
    summary: "the traceability chain: intent → constraint → artifact → evidence"
    name: OpenTopology (otop-core)
    url: https://github.com/opentopology/opentopology
    path: vendor/opentopology
    branch: main
    licence: Apache-2.0
    role: spec
    why: >
      otop's contribution is not entity modelling — it is the traceability chain
      intent -> constraint -> artifact -> evidence. That is what turns "we have a
      PII rule" into "here is the check, and here is the run that proves it fired".
    adopted:
      - upstream: schemas/otop-core-v0.2.schema.json
        kind: schema
        ours:
          - platform/src/pf/projections/otop.py
          - platform/src/pf/ontology/policy.yaml
        note: >
          Our policy layer is emitted as an otop 0.2 manifest and validated
          against this exact file. If upstream tightens the schema, the export
          fails here rather than in a consumer.
      - upstream: specs/otop-core-0.2.md
        kind: shape
        ours: [platform/src/pf/ontology/policy.yaml]
        note: >
          Relationship vocabulary taken verbatim: governed_by, implemented_by,
          verified_by. Renaming them locally would break every otop consumer.
    declined:
      - what: signatures / attestation blocks
        why: >
          Nothing signs evidence in this platform yet. An unsigned signature block
          is worse than none — it implies a guarantee that does not exist.
      - what: otop-core-0.1 schema
        why: Superseded by 0.2. We track one version so there is one answer to "does this conform".

  # ------------------------------------------------------------------- MDL --
  - id: wrenai
    summary: "MDL — the interchange format BI and text-to-SQL consume"
    name: WrenAI
    url: https://github.com/Canner/WrenAI
    path: vendor/wrenai
    branch: main
    licence: Apache-2.0 for core/**, CC-BY-4.0 for docs/**
    role: spec
    why: >
      MDL is the interchange format a BI or text-to-SQL layer can consume without
      being told our internals. Emitting it keeps the semantic layer portable.
    adopted:
      - upstream: core/wren-mdl/mdl.schema.json
        kind: schema
        ours: [platform/src/pf/projections/mdl.py]
        note: >
          Field names and the cardinality enum come from this file, not from
          memory. `layoutVersion` is an integer here — we got that wrong once by
          guessing, which is the reason the schema is vendored.
    declined:
      - what: The Wren engine, UI and AI service
        why: >
          Room is left, not taken. We emit a conformant manifest; adopting Wren
          means pointing it at `mdl/mdl.json`, with nothing else to change.

  # ------------------------------------------------------------- induction --
  - id: context-ontology-accelerator
    summary: "Scan → Model → Serve induction, with a steward in the middle"
    name: AWS Context Ontology Accelerator
    url: https://github.com/aws/context-ontology-accelerator
    path: vendor/context-ontology-accelerator
    branch: main
    licence: Apache-2.0
    role: reference
    why: >
      The Scan -> Model -> Serve shape for inducing an ontology from real systems,
      with a steward in the middle. Induction proposes; a person decides.
    adopted:
      - upstream: packages/context-manager
        kind: shape
        ours:
          - platform/src/pf/ontology/induct.py
          - platform/src/pf/ontology/proposal.py
        note: >
          Scan reads statistics rather than names, so cardinality comes from
          distinct counts. The steward loop — every axiom carrying its evidence,
          nothing auto-applied for PII or relations — is ours on top.
      - upstream: packages/vkg
        kind: shape
        ours: [platform/src/pf/kg/build.py]
        note: Virtual knowledge graph over physical tables; ours is materialised in DuckDB and queried by agents.
      - upstream: packages/mcp-server
        kind: shape
        ours: [platform/src/pf/mcp/server.py]
        note: Serving the ontology to agents over MCP rather than as a file to read.
      - upstream: scripts/agents/pr-review
        kind: shape
        ours: [.github/workflows/pr-report.yml]
    declined:
      - what: infra/ (CDK stacks, Lambda, state machines)
        why: This platform is local-first and runs on Dagster. The AWS deployment surface is not ours.
      - what: packages/web-app
        why: >
          `pf ui` is the control plane, and it reads the same graph the agents do.
