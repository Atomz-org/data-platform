# Machine-readable safety policy. Read by `pf gate`, the pre-commit hook and the
# PreToolUse hook. Modelled on loop-engineering's gate.yaml (vendor/loop-engineering).
#
# Hand-maintained. Capability-contributed rules live in the generated
# `gate.capabilities.yaml` and are merged at load time — nothing generated is
# written back into this file, so these comments survive.
#
# Keep in sync with loop-constraints.md when either changes.
version: 1

# Paths no agent may write, in any session.
denylist:
  - ".env"
  - ".env.*"
  - "**/secrets.toml"
  - "**/credentials/**"
  - "**/*_key*"
  - "**/*_secret*"
  - "**/.dlt/secrets.toml"
  - "**/target/**"          # dbt build artefacts — generated, never hand-edited
  - "**/dbt_packages/**"
  - "**/kg/graph.duckdb"    # generated by `pf kg build`
  - "**/kg/context_card.md" # generated by `pf kg card`
  - "**/data/*.duckdb"      # the warehouse itself
  # Dagster *runtime state* only. `.dagster/dagster.yaml` is deliberately not
  # denied: it is checked-in, hand-maintained instance config (the writer-pool
  # limits live there), and a blanket `.dagster/**` made it uneditable.
  - ".dagster/history/**"
  - ".dagster/storage/**"
  - ".dagster/logs/**"
  - ".dagster/schedules/**"
  - ".dagster/.*"

# Checked before the denylist, and only against it. `.env.*` must catch
# `.env.local` and `.env.production`; it also caught `.env.example`, which is a
# committed template with no secret in it and the one file someone edits when
# adding a variable. `pf check` flags every denied path git is tracking, so an
# exception here is a deliberate, visible statement rather than a silent hole.
denylist_except:
  - ".env.example"

# Paths a *project* session may not write. Platform infra is shared: a change
# made while working on one company silently affects every other.
platform_denylist:
  - "platform/**"
  - "vendor/**"
  - "pyproject.toml"
  - "uv.lock"
  - "gate.yaml"
  - "gate.capabilities.yaml"

# Changing these requires the blast radius to be reported first.
impact_required:
  - "**/transform/models/**/*.sql"
  - "**/transform/macros/**/*.sql"
  - "**/transform/models/**/*.yml"
  - "**/src/*/sources/*.py"

# Safe to change without a gate.
autoMergeAllowlist:
  - "**/*.md"
  - "**/*.sql" 
  - "**/decisions/**"
  - "**/.memory/**"
  - "**/evals/cases/**"
  - '**/transform/macros/**'

# A single loop run may not touch more than this many files.
#maxFiles: 12

# Severity at which a change is blocked rather than warned.
blockOn: breaking
