# Policy and evidence layer.
#
# Modelled on OpenTopology (otop), whose contribution is not entity-relationship
# modelling — it is the traceability chain:
#
#     intent -> constraint -> artifact -> evidence
#
# The gap that closes here is specific. This platform already had rules (PII must
# be masked; money needs a currency; a mart must declare its grain) but they lived
# in three disconnected places: prose in a skill, an if-statement in validate.py,
# and a dbt test. Nothing linked the *reason* to the *check* to the *proof*, so
# "is this policy actually enforced?" had no answer.
#
# Every policy below names the artifact that enforces it and the evidence that
# proves it ran. `pf policy status` walks that chain; unenforced policies are the
# interesting output.
version: 1
namespace: "https://data-platform.local/policy#"

policies:
  - id: money-requires-currency
    intent: >
      A monetary amount without its currency is not a number, it is a bug waiting
      for a second entity to be onboarded.
    applies_to: {role: money_amount}
    constraint: sibling_role_present
    params: {sibling: currency_code, scope: resource}
    severity: error
    enforced_by: [pf.ontology.validate:money-without-currency]
    evidence: [pf check]
    controls: [AIR-PREV-6]

  - id: entity-requires-identity
    intent: >
      A class with no identity property cannot participate in a derived join, so
      every BI and MDL projection of it is a guess.
    applies_to: {class: "*"}
    constraint: identity_declared
    params: {exclude_abstract: true}
    severity: error
    enforced_by: [pf.ontology.validate:class-without-identity]
    evidence: [pf check]
    controls: [AIR-PREV-6]

  - id: link-must-be-in-topology
    intent: >
      A foreign key pointing at a class the topology does not relate to is an
      undeclared join. Undeclared joins are how two teams compute different
      revenue from the same warehouse.
    applies_to: {annotation: links}
    constraint: relation_exists
    severity: error
    enforced_by: [pf.ontology.validate:illegal-edge]
    evidence: [pf check]
    controls: [AIR-PREV-6]

  - id: pii-not-in-consumption
    intent: >
      PII may land in raw and staging. It must not reach a mart or an exposure
      without a masking policy or an explicit, recorded waiver.
    applies_to: {role_glob: "pii_*"}
    constraint: not_in_layer
    params: {layers: [marts, semantic, consumption]}
    severity: error
    enforced_by: [pf.loops.registry:pii_audit]
    evidence: [pf loop run pii-audit, STATE.md]
    controls: [AIR-DET-16, AIR-PREV-12]

  - id: mart-declares-grain
    intent: >
      Grain is the one fact a downstream consumer cannot infer and cannot survive
      guessing. An undeclared grain is how a join silently fans out.
    applies_to: {layer: marts}
    constraint: meta_field_present
    params: {field: grain}
    severity: warning
    enforced_by: [pf.kg.build:model-grain]
    evidence: [kg/context_card.md]
    controls: [AIR-DET-13]

  - id: metric-owns-aggregation
    intent: >
      Aggregation policy — which statuses count, which timestamp, which filter —
      belongs to exactly one metric definition. A mart column named `revenue` is
      a second definition that will drift from the first.
    applies_to: {layer: marts}
    constraint: no_metric_shaped_columns
    params: {forbidden_names: [revenue, mrr, arr, churn_rate, ltv]}
    severity: warning
    enforced_by: [pf.ontology.validate:metric-shaped-column]
    evidence: [pf check]
    controls: [AIR-DET-13]

  - id: change-declares-blast-radius
    intent: >
      A model or column change must report what it breaks before it lands,
      including the human who owns each affected exposure.
    applies_to: {artifact_glob: "**/transform/models/**"}
    constraint: impact_reported
    severity: error
    enforced_by: [platform/hooks/pre_tool_use.py, platform/hooks/pre_commit.sh]
    evidence: [impact_reports, loop-ledger.json]
    controls: [AIR-DET-21, AIR-PREV-18]

  - id: change-verified-against-baseline
    intent: >
      A blast radius is a prediction made from lineage. Lineage cannot say
      whether the numbers actually moved, so a change to a mart must also be
      compared against a built baseline before it lands — otherwise "safe" means
      "nothing downstream references it", not "nothing downstream changed".
    applies_to: {artifact_glob: "**/transform/models/marts/**"}
    constraint: diff_reported
    severity: warning
    enforced_by: [pf.tools.recce:dagster_assets, pf.tools.recce:register_commands]
    evidence: [pf tool recce run]
    controls: [AIR-PREV-5]

  - id: review-artifacts-exclude-pii
    intent: >
      A value-level diff writes the rows it compared into the review tool's state
      file, which is durable and shared. Diffing a column whose role is PII
      therefore persists real addresses into an artefact that gets committed and
      passed around — the same failure `pii-not-in-consumption` prevents in the
      warehouse, one layer further out.
    applies_to: {artifact_glob: "**/transform/recce.yml"}
    constraint: pii_excluded_from_review
    severity: error
    enforced_by: [pf.ontology.model:Role.review_intent, pf.tools.recce:generate_config]
    evidence: [pf tool recce config]
    controls: [AIR-DET-1, AIR-PREV-12]

  - id: builds-record-observability
    intent: >
      A dbt build that leaves no queryable record cannot be triaged; failures
      get diagnosed from whichever log happened to survive. Every build must
      record its run and test results into the warehouse with history — for
      every test framework at once — so "is this new, recurring, or flaky?"
      is a query, not an archaeology dig.
    applies_to: {artifact_glob: "**/transform/packages.yml"}
    constraint: observability_recorded
    severity: warning
    enforced_by: [pf.tools.elementary:bootstrap_project, pf.tools.elementary:ensure_package]
    evidence: [pf tool elementary report, loop-ledger.json]
    controls: [AIR-DET-4, AIR-PREV-6]

  - id: quality-floor-derived-from-ontology
    intent: >
      Hand-written test coverage decays to whichever models someone remembered.
      The floor — an annotated mart is never empty, a declared identity
      identifies — must be derived from the ontology roles, so coverage is a
      function of annotation rather than of memory, and a wrong test is a wrong
      role rather than a stale file.
    applies_to: {artifact_glob: "**/transform/tests/expectations/**"}
    constraint: tests_derived_from_roles
    severity: warning
    enforced_by: [pf.tools.expectations:write_tests, pf.tools.expectations:bootstrap_project]
    evidence: [pf tool expectations run]
    controls: [AIR-PREV-6, AIR-PREV-5]

  - id: secrets-never-in-context
    intent: >
      A credential placed in a prompt, a model file or a committed artefact is
      durably persisted and replayed into every later session.
    applies_to: {artifact_glob: "**/secrets.toml"}
    constraint: path_denied
    severity: error
    enforced_by: [gate.yaml:denylist, platform/hooks/pre_tool_use.py]
    evidence: [pf gate]
    controls: [AIR-PREV-23, AIR-DET-16]

  # --- agent governance ------------------------------------------------------
  #
  # These ten were added when the FINOS catalogue was vendored (`pf.air`), and
  # none of them is new enforcement. Every `enforced_by` below names something
  # that was already running — the gate, the ledger, the tool contract — and had
  # simply never been written down as a policy, because the rule lived in a
  # docstring next to the code that implemented it.
  #
  # That is the whole value of having an external catalogue: it asks "where is
  # your least-privilege control?" and the answer has to be a path, not a
  # paragraph. Where the answer was already a path, this is bookkeeping. Where
  # there was no answer, `pf air coverage` reports the control as failing and we
  # left it failing rather than writing a policy that names nothing.

  - id: agent-authority-is-least-privilege
    intent: >
      An agent reaches the filesystem through one path gate, and the paths it may
      never write are declared rather than remembered. Least privilege that lives
      in a prompt is a request; in a denylist it is a control.
    applies_to: {artifact_glob: "**"}
    constraint: path_denied
    severity: error
    enforced_by: [gate.yaml:denylist, gate.yaml:platform_denylist, pf.loops.gate:check_path]
    evidence: [pf gate]
    controls: [AIR-PREV-18]

  - id: tool-contribution-may-only-tighten
    intent: >
      A tool contributes gate rules, and a plugin system that can widen the policy
      judging it is not a policy. `Tool.gate_sections()` rejects a contribution to
      any loosening section at construction, so an unsafe tool fails at import
      rather than silently permitting more.
    applies_to: {artifact_glob: "gate.capabilities.yaml"}
    constraint: tightening_only
    params: {sections: [denylist, platform_denylist, impact_required]}
    severity: error
    enforced_by: [pf.tools.spec:Tool.gate_sections]
    evidence: [pf check]
    controls: [AIR-PREV-19]

  - id: agent-decisions-are-recorded
    intent: >
      Every tool call an agent makes is written down before it happens and after
      it happens, and the gate's verdict is recorded for allows as well as denies.
      "No rule applied" and "a rule allowed it" are different facts, and only a
      record that carries both can answer what an agent was permitted to do.
    applies_to: {artifact_glob: "**"}
    constraint: action_recorded
    params: {stages: [intent, decision, execution]}
    severity: error
    enforced_by: [pf.provenance.ledger:decision, platform/hooks/pre_tool_use.py, platform/hooks/post_tool_use.py]
    evidence: [pf provenance verify]
    controls: [AIR-DET-21, AIR-DET-4]

  - id: evidence-chain-is-tamper-evident
    intent: >
      A log an agent can edit is not evidence. Each record carries the hash of the
      one before it, and the head is anchored to a timestamp authority with no
      stake in what it says — so editing the middle requires editing the end, and
      the end is countersigned.
    applies_to: {artifact_glob: "provenance/**"}
    constraint: hash_chained
    severity: error
    enforced_by: [pf.provenance.chain:verify, pf.provenance.anchor:stamp_rfc3161, gate.yaml:denylist]
    evidence: [pf provenance verify]
    controls: [AIR-DET-21]

  - id: sister-projects-are-isolated
    intent: >
      Business logic does not transfer between entities, so an assumption carried
      from one sister company into another is a bug by construction. A project
      session may not read or write another project, and may not write shared
      infra at all.
    applies_to: {artifact_glob: "groups/**"}
    constraint: cross_tenant_denied
    severity: error
    enforced_by: [gate.yaml:platform_denylist, pf.loops.gate:project_for]
    evidence: [pf gate]
    controls: [AIR-PREV-22]

  - id: agent-authority-is-revocable
    intent: >
      A control that cannot be switched off mid-incident is a control you find out
      about afterwards. Revocation is checked before intent is written, and an
      unreadable revocation file fails closed.
    applies_to: {artifact_glob: "**"}
    constraint: revocable
    severity: error
    enforced_by: [pf.provenance.ledger:revoke, pf.provenance.ledger:is_revoked]
    evidence: [pf provenance verify]
    controls: [AIR-PREV-18]

  - id: high-impact-actions-need-a-human
    intent: >
      Human oversight is a chain that shows the approval, not a document that
      asserts it. Approvals are append-only and bound to the action they approve,
      and an actor approving their own action is a finding rather than an
      approval.
    applies_to: {artifact_glob: "**"}
    constraint: approval_recorded
    severity: error
    enforced_by: [pf.provenance.ledger:approve, pf.provenance.audit:report]
    evidence: [pf provenance verify]
    controls: [AIR-DET-11]

  - id: model-routing-is-declared
    intent: >
      Which model answers which step is a declared table, not whatever the caller
      passed. An unregistered step is recorded as such, and the recorded verdict
      matches what actually happened rather than what policy would have preferred.
    applies_to: {artifact_glob: "**/agents/**"}
    constraint: routing_declared
    severity: warning
    enforced_by: [pf.agents.base:AGENTS]
    evidence: [pf provenance verify]
    controls: [AIR-PREV-10]

  - id: upstream-licences-are-reviewed
    intent: >
      Every upstream this platform borrowed from carries a licence, and some of
      them constrain what we may ship. The review is written down per upstream and
      surfaced in the listing, so a constraint is a fact in the registry rather
      than something someone once checked.
    applies_to: {artifact_glob: "vendor/**"}
    constraint: licence_reviewed
    severity: warning
    enforced_by: [pf.vendor.model:load_registry, pf.vendor.verify:verify]
    evidence: [pf check]
    controls: [AIR-PREV-7]

  - id: control-baseline-is-declared
    intent: >
      A risk register that names controls nobody enforces is a document. Each
      entity declares in `air.yaml` which controls it commits to; those are
      derived from the repository on every run and block the merge when they
      fail, while everything outside the baseline is reported and does not.
    applies_to: {artifact_glob: "**/air.yaml"}
    constraint: baseline_declared
    severity: error
    enforced_by: [pf.air.coverage:assess, pf.air.register:render_register]
    evidence: [pf air coverage, governance/air-register.md]
    # No `controls:` — this is our rule about how controls are declared, not
    # one of the framework's controls. Mapping it to AIR-RC-22 (a *risk*, not
    # a mitigation) would be the category error the catalogue exists to stop.

# Evidence kinds the chain may reference. An evidence entry naming something not
# listed here is itself a finding — that is how the chain stays honest.
evidence_kinds:
  - {id: "pf check",   produces: conformance report,  durable: false}
  - {id: "pf gate",    produces: path verdict,        durable: false}
  - {id: "STATE.md",   produces: open findings,       durable: true}
  - {id: "impact_reports", produces: blast radius history, durable: true}
  - {id: "loop-ledger.json", produces: run history,   durable: true}
  - {id: "kg/context_card.md", produces: project index, durable: true}
  - {id: "pf loop run pii-audit", produces: PII findings, durable: false}
  - {id: "pf tool recce run",    produces: data diff against baseline, durable: true}
  - {id: "pf tool recce config", produces: derived review checks, durable: true}
  # The quality-stack pair. The report is durable because the tables it renders
  # are — Elementary's history is append-only in the warehouse. The expectations
  # run is a dbt test invocation whose verdicts land in that same history, so
  # the command itself stores nothing.
  - {id: "pf tool elementary report",  produces: observability report over recorded history, durable: true}
  - {id: "pf tool expectations run",   produces: quality floor verdicts, durable: false}
  # Added with the agent-governance policies above. `pf provenance verify` is
  # durable because the thing it audits is: the ledger is append-only and
  # anchored, so re-running the audit next year reads the same records. The
  # other two are re-derived on every call and deliberately store nothing.
  - {id: "pf provenance verify", produces: ledger audit, durable: true}
  - {id: "pf air coverage", produces: control coverage verdicts, durable: false}
  - {id: "governance/air-register.md", produces: per-entity risk register, durable: true}
