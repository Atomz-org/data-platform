# Dagster instance config. DAGSTER_HOME points here.
#
# The pools block is load-bearing: every writing asset is tagged with a
# per-project pool (`duckdb_writer_<project>`) limited to 1. That is what lets
# sister companies run in parallel while respecting DuckDB's single-writer lock.
#
# `runs` and `pools` must both live under `concurrency` — setting
# run_coordinator.max_concurrent_runs alongside them is rejected as of 1.13.

telemetry:
  enabled: false

concurrency:
  runs:
    max_concurrent_runs: 8
  pools:
    # `op`, not `run`. Run granularity takes one slot for a whole run, which
    # serialises *runs* but lets every step inside a single run execute at once
    # — so the three dlt ingest assets fired concurrently under the
    # multiprocess executor and collided on DuckDB's single-writer lock.
    # Op granularity is what actually holds the pool to one writer at a time.
    granularity: op
    default_limit: 1
