name: 'commodity_shared'
version: '1.0.0'
config-version: 2
profile: 'commodity_shared'
# `macros` reach every sister through the sister's own macro-paths, so calls
# stay unqualified. `seeds` are conformed reference data: `pf bootstrap`
# installs this directory in each sister as a local dbt package, which keeps its
# compiled files inside that sister's target/. Never point a sister's
# seed-paths here directly.
macro-paths: ["macros"]
seed-paths: ["seeds"]
