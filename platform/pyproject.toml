[project]
name = "pf"
version = "0.1.0"
description = "Platform runtime, ontology, knowledge graph, MCP and UI"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Suresh Swaminathan", email = "sureshswaminathan.96@gmail.com" }]
requires-python = ">=3.11,<3.13"
dependencies = [
  "duckdb>=1.1",
  "pyyaml>=6",
  # Vendored upstream schemas (OpenTopology, WrenAI MDL) are validated against,
  # not matched by eye — see pf.vendor.verify.
  "jsonschema>=4.20",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
data = ["dlt[duckdb]>=1.4", "dbt-core>=1.9", "dbt-duckdb>=1.9"]
orchestration = ["dagster>=1.9", "dagster-webserver>=1.9", "dagster-dbt>=0.25"]
agents = ["anthropic>=0.40"]
# `pf mcp` imports FastMCP lazily inside main(), so the package still installs
# and every other command still works without it. Without the extra, `pf mcp`
# fails at startup with a plain ImportError rather than the server silently
# serving nothing.
mcp = ["mcp>=1.2"]
# The artefact store (`pf artifacts`, pf/artifacts.py). boto3 is already present
# transitively via dlt, which is exactly why it is declared here: `pf artifacts`
# working today by accident of someone else's dependency tree is not the same as
# it being supported, and the day dlt drops it the failure would land on recce.
artifacts = ["boto3>=1.34"]
# The control plane (`pf stack`, pf/stack/). Dagster's run and event storage on
# OpenMetadata's Postgres instead of a SQLite file. Optional because a laptop
# with no stack running keeps the SQLite instance and needs neither package —
# `pf stack render` writes no storage block when PF_STACK_PG_HOST is unset.
#
# dagster-postgres tracks dagster's library numbering, not dagster's: 0.29.x
# pairs with dagster 1.13.x. A floor on the wrong series resolves to a release
# built against a different event-log schema.
stack = ["dagster-postgres>=0.29,<1", "psycopg2-binary>=2.9"]

[project.scripts]
pf = "pf.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pf"]
