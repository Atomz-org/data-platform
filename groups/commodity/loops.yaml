# Which platform loops watch this group, and how. `pf loop list` shows the
# registry as shipped; `pf loop list --group commodity` shows it with this file
# applied.
#
# A key here applies to **every sister project** in commodity, for the same
# reason tools.yaml does: sisters share infrastructure and differ only in
# business logic, so "freshness is judged once a day, after the close" is
# decided once for the family. Anything not named here inherits the registry.
#
# One entry per loop, keyed by its registry name:
#
#   loops:
#     freshness-triage:
#       enabled: true                # default true; put a `reason` beside false
#       reason: "why it is off"      # shown by `pf loop list --group commodity`
#       cadence: "daily, after the close"
#       token_budget: 4000           # a non-negative integer
#       autonomy: L1                 # may only LOWER the registry level (L2 -> L1)
#       waivers:                     # findings to suppress; a reason is mandatory
#         - node: "rpt_*"            # a node name or an fnmatch glob; for
#           reason: "..."            #   pii-audit, model.column
#
# Autonomy is lower-only on purpose: a level is earned in the ledger and granted
# in LOOP.md, never taken by an entity for itself, so a request to raise one is
# refused. A waiver without a reason is refused too. The next reader has to know
# whether a silenced finding was a decision or an accident.
#
# Empty means "the registry as shipped". It is your file now.
version: 1
loops:
  freshness-triage:
    # Every feed here is a daily candle keyed on the trading day. The registry's
    # two-hourly pass re-reads the same day and re-raises the same finding.
    cadence: "daily, after the US futures close (weekdays)"
  metric-gap-harvester:
    # Four kinds of mart are meant to reach no metric of their own. A dimension
    # describes what the facts measure; the boards are presentation; the two
    # restatement facts are the landed price in another unit, and a mean on
    # them would be avg_landed_price_inr divided a second way.
    waivers:
      - node: "dim_*"
        reason: "dimension tables describe; metrics measure the facts that reference them"
      - node: "rpt_*"
        reason: "presentation boards behind the price board; their metrics live on the facts they read"
      - node: "fct_mcx_lot_equivalents_daily"
        reason: "landed prices restated per MCX contract and lot; a metric here would restate avg_landed_price_inr in another unit (ADR-0003: every mean divides the same way, once)"
      - node: "fct_precious_metal_retail_prices_daily"
        reason: "landed gold and silver restated per Indian retail unit and purity; same reason"
  vendor-drift:
    # Vendor pins belong to the repository, not to a sister.
    enabled: false
    reason: "repo-scoped; reported once from the platform, not once per sister"
